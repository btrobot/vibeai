# ============================================================
# CI Workflow — 持续集成
# ============================================================
# 触发: 所有 PR + push to main/release/*
# 职责: 代码质量门禁 + 测试矩阵 + E2E + Docker 构建验证
# ============================================================
name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

# 同一 PR 的新提交自动取消旧构建
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '9'

jobs:
  # ────────────────────────────────────────────
  # 代码质量门禁: Lint + Type Check
  # ────────────────────────────────────────────
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          cd server && pnpm install --frozen-lockfile --prefer-offline

      - name: ESLint
        run: pnpm lint

      - name: TypeScript type check
        run: pnpm ts-check

  # ────────────────────────────────────────────
  # 单元测试矩阵: 前端 + 后端并行
  # ────────────────────────────────────────────
  test:
    name: Unit Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [quality]

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            cwd: '.'
            env:
              VITE_API_BASE_URL: http://localhost:3001
          - name: backend
            cwd: server
            env:
              DATABASE_URL: postgres://vibeai:vibeai@localhost:5432/vibeai
              JWT_SECRET: ci-test-secret

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vibeai
          POSTGRES_PASSWORD: vibeai
          POSTGRES_DB: vibeai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          cd server && pnpm install --frozen-lockfile --prefer-offline

      - name: Run tests
        working-directory: ${{ matrix.cwd }}
        env: ${{ matrix.env }}
        run: pnpm test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.name }}
          path: ${{ matrix.cwd == '.' && 'coverage/' || 'server/coverage/' }}
          retention-days: 7
          if-no-files-found: ignore

  # ────────────────────────────────────────────
  # 构建验证: 确保前后端可编译
  # ────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          cd server && pnpm install --frozen-lockfile --prefer-offline

      - name: Build frontend (Vite)
        run: pnpm vite build

      - name: Build backend (TypeScript)
        working-directory: server
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            dist/
            server/dist/
          retention-days: 3

  # ────────────────────────────────────────────
  # E2E 测试 (Playwright)
  # ────────────────────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [quality]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vibeai
          POSTGRES_PASSWORD: vibeai
          POSTGRES_DB: vibeai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          cd server && pnpm install --frozen-lockfile --prefer-offline

      - name: Build backend
        working-directory: server
        run: pnpm build

      - name: Start backend
        env:
          DATABASE_URL: postgres://vibeai:vibeai@localhost:5432/vibeai
          JWT_SECRET: ci-test-secret
          PORT: '3001'
        run: |
          cd server && node dist/main.js &
          # Wait for backend to be ready
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/api/health > /dev/null 2>&1 && break
            sleep 1
          done

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          VITE_API_BASE_URL: http://localhost:3001
          BASE_URL: http://localhost:5000
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # ────────────────────────────────────────────
  # Docker 构建验证 (仅 PR)
  # 确保 Dockerfile 语法正确、构建可通过
  # ────────────────────────────────────────────
  docker-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            PROJECT_NAME=vibeai
            PROJECT_VERSION=ci-check
            BUILD_DATE=${{ github.event.pull_request.updated_at }}
            GIT_COMMIT=${{ github.event.pull_request.head.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────
  # CI 结果汇总 (用于分支保护规则)
  # ────────────────────────────────────────────
  ci-pass:
    name: CI Passed
    runs-on: ubuntu-latest
    needs: [quality, test, build, e2e]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
          if [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::One or more CI jobs were cancelled"
            exit 1
          fi
          echo "All CI checks passed"
