name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  IMAGE_NAME: btrobot/vibeai
  CONTAINER_NAME: vibeai
  APP_PORT: 6000
  MIRROR_REGISTRY: ghcr.nju.edu.cn

jobs:
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PROJECT_NAME=vibeai
            PROJECT_VERSION=1.0.0

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail

            IMAGE_NAME="${{ env.IMAGE_NAME }}"
            CONTAINER_NAME="${{ env.CONTAINER_NAME }}"
            APP_PORT=${{ env.APP_PORT }}
            MIRROR_REGISTRY="${{ env.MIRROR_REGISTRY }}"
            ENV_FILE="/data/vibeai/.env.local"

            echo "=== VibeAI Deploy ==="
            echo "Image: ${MIRROR_REGISTRY}/${IMAGE_NAME}"

            # 登录 ghcr.io（推送用）
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 记录旧容器状态（用于回滚）
            OLD_IMAGE=""
            if docker ps -a --format '{{.Names}} {{.ID}}' | grep -q "^${CONTAINER_NAME} "; then
              OLD_IMAGE=$(docker inspect --format '{{.Image}}' "${CONTAINER_NAME}")
              echo "旧容器镜像 SHA: ${OLD_IMAGE}"
            fi

            # 拉取新镜像（南京大学镜像站）
            echo "拉取新镜像..."
            docker pull "${MIRROR_REGISTRY}/${IMAGE_NAME}:latest"

            # 停止旧容器
            if docker ps -a --format '{{.Names}}' | grep -q "^${CONTAINER_NAME}$"; then
              echo "停止旧容器..."
              docker stop "${CONTAINER_NAME}"
              docker rm "${CONTAINER_NAME}"
            fi

            # 启动新容器
            echo "启动新容器..."
            docker run -d \
              --name "${CONTAINER_NAME}" \
              --restart unless-stopped \
              -p ${APP_PORT}:5000 \
              --env-file "${ENV_FILE}" \
              "${MIRROR_REGISTRY}/${IMAGE_NAME}:latest"

            echo "等待服务启动..."
            sleep 5

            # 健康检查
            echo "健康检查..."
            for i in {1..10}; do
              if curl -sf http://localhost:5000/api/health > /dev/null 2>&1; then
                echo "✅ 部署成功！访问：http://$(hostname -I | awk '{print $1}'):${APP_PORT}"
                exit 0
              fi
              echo "  等待中... ($i/10)"
              sleep 2
            done

            echo " 健康检查失败，回滚..."
            docker stop "${CONTAINER_NAME}"
            docker rm "${CONTAINER_NAME}"

            if [ -n "${OLD_IMAGE}" ]; then
              docker run -d \
                --name "${CONTAINER_NAME}" \
                --restart unless-stopped \
                -p ${APP_PORT}:5000 \
                --env-file "${ENV_FILE}" \
                "${OLD_IMAGE}"
              echo "已回滚到旧版本"
            fi

            exit 1
