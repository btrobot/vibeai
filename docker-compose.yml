services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        PNPM_VERSION: ${PNPM_VERSION:-9.0.0}
    ports:
      - "${APP_PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://vibeai:vibeai@db:5432/vibeai
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - BACKEND_PORT=3001
      - DEPLOY_RUN_PORT=5000
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5000}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - uploads:/app/uploads

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=vibeai
      - POSTGRES_PASSWORD=vibeai
      - POSTGRES_DB=vibeai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibeai"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  uploads: