# VibeAI - Production compose (Forge managed)
#
# Architecture (consistent with prod-01):
#   DB  = postgres:16-alpine in compose, data in named volume pgdata
#   App = NestJS + Vite SPA, connects to db:5432 via compose internal network
#   Caddy (auto-ingress) reaches app via upstream network -> vibeai-app:5000
#
name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}

services:
  app:
    image: ${IMAGE_NAME:?IMAGE_NAME is required}
    container_name: ${COMPOSE_PROJECT_NAME}-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://vibeai:${DB_PASSWORD:?DB_PASSWORD is required}@db:5432/vibeai
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - DEPLOY_RUN_PORT=5000
      - PORT=5000
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      # 存储：MinIO（S3 兼容对象存储），镜像源 8.138.175.157:5000
      - STORAGE_PROVIDER=s3
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      - S3_BUCKET_NAME=${MINIO_BUCKET:-vibeai}
      - S3_REGION=${S3_REGION:-us-east-1}
      - REPLICATE_API_TOKEN=${REPLICATE_API_TOKEN:-}
      - REPLICATE_BASE_URL=${REPLICATE_BASE_URL:-https://api.replicate.com}
      - COZE_PROJECT_DOMAIN_DEFAULT=${COZE_PROJECT_DOMAIN_DEFAULT:-}

    ports:
      - "${APP_PORT:-5000}:5000"

    networks:
      - internal
      - upstream

    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    mem_limit: ${MEM_LIMIT:-512m}
    pids_limit: ${PIDS_LIMIT:-256}
    stop_grace_period: 30s

    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:5000/api/health']
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  db:
    image: ccr.ccs.tencentyun.com/nodecoda/postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-db
    restart: unless-stopped

    environment:
      - POSTGRES_USER=vibeai
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - POSTGRES_DB=vibeai

    volumes:
      - pgdata:/var/lib/postgresql/data

    networks:
      - internal

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vibeai']
      interval: 5s
      timeout: 5s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    image: ${MINIO_IMAGE:-ccr.ccs.tencentyun.com/nodecoda/minio:latest}
    container_name: ${COMPOSE_PROJECT_NAME}-minio
    restart: unless-stopped

    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}

    command: server /data --console-address ":9001"

    volumes:
      - miniodata:/data

    networks:
      - internal

    healthcheck:
      test: ['CMD-SHELL', 'mc alias set local http://localhost:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} >/dev/null 2>&1; mc ready local']
      interval: 10s
      timeout: 5s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  minio-init:
    image: ${MINIO_IMAGE:-ccr.ccs.tencentyun.com/nodecoda/minio:latest}
    container_name: ${COMPOSE_PROJECT_NAME}-minio-init
    restart: "no"

    depends_on:
      minio:
        condition: service_healthy

    entrypoint: ['/bin/sh', '-c']
    command:
      - mc alias set m http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD} && mc mb --ignore-existing m/$${MINIO_BUCKET:-vibeai}

    networks:
      - internal

networks:
  internal:
  upstream:
    external: true
    name: ${UPSTREAM_NETWORK:-upstream}

volumes:
  pgdata:
  miniodata:
