# ============================================================
# docker-compose.yml — VibeAI 本地开发 & 部署
# ============================================================
# 用法:
#   开发: docker compose up -d
#   生产: docker compose -f docker-compose.yml up -d --build
#   构建: docker compose build --build-arg DEPLOY_REGION=cn
# ============================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: '24'
        PROJECT_NAME: vibeai
        PROJECT_VERSION: ${PROJECT_VERSION:-1.0.0}
        DEPLOY_REGION: ${DEPLOY_REGION:-auto}
    image: ${IMAGE_NAME:-vibeai:local}
    ports:
      - '${APP_PORT:-5000}:5000'
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://vibeai:vibeai@db:5432/vibeai
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - DEPLOY_RUN_PORT=5000
      - PORT=5000
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5000}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5000/api/health']
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  db:
    image: postgres:16-alpine
    ports:
      - '${DB_PORT:-5432}:5432'
    environment:
      - POSTGRES_USER=vibeai
      - POSTGRES_PASSWORD=vibeai
      - POSTGRES_DB=vibeai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vibeai']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
