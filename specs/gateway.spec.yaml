domain: gateway
version: '3.0'
last_updated: '2026-08-17'
entities:
  - name: AICapability
    table: ai_capabilities
    description: AI 能力定义
    fields:
      - name: id
        type: uuid
        pk: true
        default: gen_random_uuid()
      - name: slug
        type: varchar(100)
        notNull: true
        unique: true
      - name: name
        type: varchar(255)
        notNull: true
      - name: description
        type: text
        nullable: true
      - name: category
        type: varchar(50)
        notNull: true
      - name: icon
        type: text
        nullable: true
      - name: inputSchema
        type: jsonb
        default: '{}'
      - name: outputSchema
        type: jsonb
        default: '{}'
      - name: config
        type: jsonb
        default: '{}'
      - name: isActive
        type: boolean
        notNull: true
        default: true
      - name: sortOrder
        type: integer
        notNull: true
        default: 0
      - name: createdAt
        type: timestamp
        notNull: true
        default: now()
      - name: updatedAt
        type: timestamp
        notNull: true
        default: now()
    indexes:
      - name: ai_capabilities_slug_idx
        fields:
          - slug
      - name: ai_capabilities_category_idx
        fields:
          - category
    timestamps: true
  - name: AIModel
    table: ai_models
    description: AI 模型注册表
    fields:
      - name: id
        type: uuid
        pk: true
        default: gen_random_uuid()
      - name: slug
        type: varchar(100)
        notNull: true
        unique: true
      - name: name
        type: varchar(255)
        notNull: true
      - name: providerName
        type: varchar(100)
        notNull: true
        default: coze
        desc: 供应商标识，当前固定为 coze
      - name: modality
        type: varchar(50)
        notNull: true
        desc: text_generation | image_generation | video_generation
      - name: sdkModelId
        type: varchar(200)
        notNull: true
        desc: 传给 Coze SDK 的模型 ID
      - name: sdkClient
        type: varchar(50)
        notNull: true
        default: llm
        desc: llm | image_generation | video_generation
      - name: capabilities
        type: text[]
        default: '[]'
        desc: 支持的能力 slug 列表
      - name: description
        type: text
        nullable: true
      - name: avatar
        type: text
        nullable: true
      - name: contextWindow
        type: integer
        nullable: true
        desc: LLM 上下文窗口大小
      - name: maxOutputTokens
        type: integer
        nullable: true
      - name: inputModes
        type: text[]
        default: '[]'
        desc: 支持的输入类型 text|image_url|video_url
      - name: outputType
        type: varchar(50)
        notNull: true
        desc: 输出类型 text|image|video
      - name: constraints
        type: jsonb
        default: '{}'
        desc: 模型约束（图片尺寸、视频时长等）
      - name: inputSchema
        type: jsonb
        default: '{}'
        desc: 输入参数 JSON Schema（参考 Replicate model.input_schema）
      - name: defaultParams
        type: jsonb
        default: '{}'
        desc: 默认参数（temperature, size, duration 等）
      - name: costCredits
        type: integer
        notNull: true
        default: 1
        desc: 每次调用消耗的信用额度
      - name: tags
        type: text[]
        default: '[]'
      - name: isActive
        type: boolean
        notNull: true
        default: true
      - name: isFeatured
        type: boolean
        notNull: true
        default: false
      - name: sortOrder
        type: integer
        notNull: true
        default: 0
      - name: createdAt
        type: timestamp
        notNull: true
        default: now()
      - name: updatedAt
        type: timestamp
        notNull: true
        default: now()
    indexes:
      - name: ai_models_slug_idx
        fields:
          - slug
      - name: ai_models_capability_slug_idx
        fields:
          - capabilitySlug
      - name: ai_models_modality_idx
        fields:
          - modality
      - name: ai_models_active_idx
        fields:
          - isActive
    timestamps: true
  - name: ProviderAttempt
    table: provider_attempts
    description: SDK 调用审计日志
    fields:
      - name: id
        type: uuid
        pk: true
        default: gen_random_uuid()
      - name: taskId
        type: uuid
        notNull: true
        fk:
          table: tasks
          field: id
          onDelete: cascade
      - name: modelSlug
        type: varchar(100)
        notNull: true
      - name: providerName
        type: varchar(100)
        notNull: true
        default: coze
      - name: sdkClient
        type: varchar(50)
        notNull: true
      - name: requestPayload
        type: jsonb
        notNull: true
        desc: 发送给 SDK 的请求参数
      - name: responsePayload
        type: jsonb
        nullable: true
        desc: SDK 返回的响应
      - name: status
        type: varchar(20)
        notNull: true
        default: pending
        desc: pending | success | failed | timeout
      - name: errorMessage
        type: text
        nullable: true
      - name: durationMs
        type: integer
        nullable: true
        desc: 调用耗时（毫秒）
      - name: attemptNumber
        type: integer
        notNull: true
        default: 1
      - name: costPerCall
        type: numeric(10,4)
        nullable: true
        desc: 单次调用采购成本（美元），用于利润分析
      - name: costPerSecond
        type: numeric(10,4)
        nullable: true
        desc: 按秒采购成本（美元），用于视频和音频利润分析
      - name: startedAt
        type: timestamp
        notNull: true
        default: now()
      - name: completedAt
        type: timestamp
        nullable: true
      - name: createdAt
        type: timestamp
        notNull: true
        default: now()
    indexes:
      - name: provider_attempts_task_id_idx
        fields:
          - taskId
      - name: provider_attempts_model_slug_idx
        fields:
          - modelSlug
      - name: provider_attempts_status_idx
        fields:
          - status
    timestamps: false
  - name: ModelProvider
    table: model_providers
    description: 多 Provider 渠道实例（同一模型可有多个渠道，支持优先级路由和故障切换）
    fields:
      - name: id
        type: uuid
        pk: true
        default: gen_random_uuid()
      - name: modelSlug
        type: varchar(100)
        notNull: true
        fk:
          table: ai_models
          field: slug
          onDelete: cascade
        desc: 关联的逻辑模型 slug
      - name: providerName
        type: varchar(100)
        notNull: true
        desc: 供应商标识（openai | replicate | coze | ...）
      - name: sdkModelId
        type: varchar(200)
        notNull: true
        desc: 渠道侧模型标识（如 owner/model:hash）
      - name: sdkClient
        type: varchar(50)
        notNull: true
        desc: 适配器标识（llm | image | video | replicate | openai）
      - name: priority
        type: integer
        notNull: true
        default: 1
        desc: 优先级（数字越小优先级越高）
      - name: costPerCall
        type: numeric(10,4)
        nullable: true
        desc: 单次调用采购成本（美元）
      - name: costPerSecond
        type: numeric(10,4)
        nullable: true
        desc: 按秒计费成本（美元，视频/音频）
      - name: config
        type: jsonb
        default: '{}'
        desc: 渠道特定配置
      - name: isActive
        type: boolean
        notNull: true
        default: true
      - name: createdAt
        type: timestamp
        notNull: true
        default: now()
      - name: updatedAt
        type: timestamp
        notNull: true
        default: now()
    indexes:
      - name: model_providers_model_slug_idx
        fields:
          - modelSlug
      - name: model_providers_active_idx
        fields:
          - isActive
      - name: model_providers_model_priority_idx
        fields:
          - modelSlug
          - priority
    timestamps: true
  - name: CapabilityModelRoute
    table: capability_model_routes
    description: 能力到逻辑模型的默认路由顺序
    fields:
      - name: id
        type: uuid
        pk: true
        default: gen_random_uuid()
      - name: capabilitySlug
        type: varchar(100)
        notNull: true
        desc: 代码能力注册表中的能力 slug
      - name: modelSlug
        type: varchar(100)
        notNull: true
        fk:
          table: ai_models
          field: slug
          onDelete: cascade
        desc: 关联的逻辑模型 slug
      - name: priority
        type: integer
        notNull: true
        default: 1
        desc: 数字越小越优先，首个有效路由为默认模型
      - name: isActive
        type: boolean
        notNull: true
        default: true
      - name: createdAt
        type: timestamp
        notNull: true
        default: now()
      - name: updatedAt
        type: timestamp
        notNull: true
        default: now()
    indexes:
      - name: capability_model_routes_capability_model_uidx
        fields:
          - capabilitySlug
          - modelSlug
      - name: capability_model_routes_lookup_idx
        fields:
          - capabilitySlug
          - isActive
          - priority
    timestamps: true
operations:
  - name: listCapabilities
    method: GET
    path: /gateway/capabilities
    description: 获取 AI 能力列表
    auth: jwt
    pre:
      - 用户已登录
    post:
      - 返回激活的 AICapability 列表（按 sortOrder 排序）
    test: true
  - name: getCapabilityDetail
    method: GET
    path: /gateway/capabilities/:slug
    description: 获取能力详情
    auth: jwt
    pre:
      - 用户已登录
    post:
      - 返回 AICapability + 关联的 AIModel 列表
    errors:
      - status: 404
        condition: 能力不存在
        message: AI 能力不存在
    test: true
  - name: listModels
    method: GET
    path: /gateway/models
    description: 获取模型列表
    auth: jwt
    pre:
      - 用户已登录
    post:
      - 返回激活的 AIModel 列表，支持 ?capability=xxx 过滤
    test: true
  - name: getModelDetail
    method: GET
    path: /gateway/models/:slug
    description: 获取模型详情（含 inputSchema）
    auth: jwt
    pre:
      - 用户已登录
    post:
      - 返回 AIModel 详情
    errors:
      - status: 404
        condition: 模型不存在
        message: AI 模型不存在
    test: true
  - name: submitGeneration
    method: POST
    path: /gateway/generate
    description: 提交生成任务（图片/视频）
    auth: jwt
    pre:
      - 用户已登录
      - 信用额度充足（预扣）
      - modelSlug 对应模型存在且 active
    effect:
      - 创建 Task 记录（type=capabilitySlug, status=queued）
      - 调用 BillingService.reserveCredits 预扣信用
      - 异步执行 ProtocolAdapter
      - 结果转存到 StorageObject
      - 调用 BillingService.settleCredits 结算
    errors:
      - status: 402
        condition: 信用额度不足
        message: 信用额度不足
      - status: 404
        condition: 模型不存在
        message: AI 模型不存在
      - status: 422
        condition: 输入参数不符合 inputSchema
        message: 输入参数校验失败
    test: true
  - name: chat
    method: POST
    path: /gateway/chat
    description: LLM 文本生成（SSE 流式）
    auth: jwt
    pre:
      - 用户已登录
      - 信用额度充足
    effect:
      - 直接调用 LLMClient.stream()
      - 通过 SSE 流式返回
      - 不创建 Task 记录
      - 按实际 Token 消耗结算信用
    errors:
      - status: 402
        condition: 信用额度不足
        message: 信用额度不足
      - status: 404
        condition: 模型不存在
        message: AI 模型不存在
    test: true
  - name: quickCreate
    method: POST
    path: /gateway/quick-create
    description: 快捷创作（预设 Recipe + 参数合并）
    auth: jwt
    pre:
      - 用户已登录
      - 信用额度充足
    effect:
      - 根据 recipeId 查找预设配置
      - 合并用户输入参数
      - 调用 submitGeneration
    errors:
      - status: 404
        condition: Recipe 不存在
        message: 快捷创作方案不存在
      - status: 402
        condition: 信用额度不足
        message: 信用额度不足
    test: true
  - name: listRecipes
    method: GET
    path: /gateway/recipes
    description: 获取快捷创作方案列表
    auth: jwt
    pre:
      - 用户已登录
    effect:
      - 返回所有预设快捷创作方案（按 sortOrder 排序）
    test: true
  - name: toggleModel
    method: POST
    path: /gateway/admin/models/:slug/toggle
    description: 启用/禁用 AI 模型
    auth: jwt
    pre:
      - 用户已登录
      - 当前用户为管理员
    effect:
      - 翻转 AIModel.isActive
      - 记录审计日志
    errors:
      - status: 404
        condition: 模型不存在
        message: 模型不存在
    test: true
  - name: toggleProvider
    method: POST
    path: /gateway/admin/providers/:id/toggle
    description: 启用/禁用 Provider
    auth: jwt
    pre:
      - 用户已登录
      - 当前用户为管理员
    effect:
      - 翻转 modelProviders.isActive
      - 记录审计日志
    errors:
      - status: 404
        condition: Provider 不存在
        message: Provider 不存在
    test: true
  - name: getModelConfiguration
    method: GET
    path: /admin/model-config
    description: 获取模型、Provider 和默认路由聚合配置
    auth: jwt
    pre:
      - 当前用户为管理员
    post:
      - 返回全部模型、Provider、能力和路由
    test: true
  - name: createConfiguredModel
    method: POST
    path: /admin/model-config/models
    description: 创建逻辑模型
    auth: jwt
    pre:
      - 当前用户为管理员
      - slug 全局唯一
    effect:
      - 创建 AIModel
    errors:
      - status: 409
        condition: slug 已存在
        message: 模型 slug 已存在
        test: model-config.service.test.ts 拒绝重复 slug
    test: true
  - name: updateConfiguredModel
    method: PATCH
    path: /admin/model-config/models/:slug
    description: 更新逻辑模型可编辑配置
    auth: jwt
    pre:
      - 当前用户为管理员
      - slug 不可修改
    effect:
      - 更新名称、能力、成本、约束和展示配置
    test: true
  - name: setConfiguredModelStatus
    method: PATCH
    path: /admin/model-config/models/:slug/status
    description: 设置逻辑模型启停状态
    auth: jwt
    pre:
      - 当前用户为管理员
      - 停用当前默认模型时存在同能力的其他有效路由
    effect:
      - 更新 AIModel.isActive
    errors:
      - status: 409
        condition: 模型是能力的唯一有效默认路由
        message: 请先配置替代默认模型
        test: model-config.service.test.ts 阻止停用唯一默认模型
    test: true
  - name: createConfiguredProvider
    method: POST
    path: /admin/model-config/providers
    description: 为逻辑模型创建 Provider 渠道
    auth: jwt
    pre:
      - 当前用户为管理员
      - Provider 组合标识唯一
    effect:
      - 创建 ModelProvider
    test: true
  - name: updateConfiguredProvider
    method: PATCH
    path: /admin/model-config/providers/:id
    description: 更新 Provider 渠道配置
    auth: jwt
    pre:
      - 当前用户为管理员
    effect:
      - 更新 SDK 模型、优先级、采购成本和渠道参数
    test: true
  - name: setConfiguredProviderStatus
    method: PATCH
    path: /admin/model-config/providers/:id/status
    description: 设置 Provider 启停状态
    auth: jwt
    pre:
      - 当前用户为管理员
    effect:
      - 更新 ModelProvider.isActive
    test: true
  - name: replaceCapabilityRoutes
    method: PUT
    path: /admin/model-config/routes/:capabilitySlug
    description: 原子替换指定能力的有序模型路由
    auth: jwt
    pre:
      - 当前用户为管理员
      - 至少提交一个启用且支持该能力的模型
    effect:
      - 在事务中替换该能力全部路由并顺序写入 priority
    errors:
      - status: 422
        condition: 模型不支持目标能力或路由为空
        message: 路由配置无效
        test: model-config.service.test.ts 拒绝空路由和能力不匹配模型
    test: true
rules:
  - name: capability_slug_unique
    id: GTW-001
    severity: error
    level: error
    description: AI 能力 slug 全局唯一
    enforcement: DB unique 约束
    test: getCapability 按 slug 返回正确的能力
  - name: model_slug_unique
    id: GTW-002
    severity: error
    level: error
    description: AI 模型 slug 全局唯一
    enforcement: DB unique 约束
    test: getModel 按 slug 返回正确的模型
  - name: model_capability_valid
    id: GTW-004
    severity: error
    level: error
    description: 提交生成任务时 modelSlug 必须对应一个 active 的 AIModel
    enforcement: submitGeneration 中校验 model 存在且 isActive=true
    test: 不存在的能力抛出 NotFoundException
  - name: credit_reserve_before_submit
    id: GTW-005
    severity: error
    level: error
    description: 提交生成任务前必须预扣信用额度（reserve 而非仅检查）
    enforcement: submitGeneration 先调 BillingService.reserveCredits 再创建 Task
    test: 信用不足时返回 409 并拒绝创建
  - name: result_persist
    id: GTW-006
    severity: error
    level: error
    description: 生成结果必须转存到 StorageObject，不直接暴露外部 URL
    enforcement: ProtocolAdapter 执行成功后调用 StorageService.persistFromUrl
    test: should persist generated results
  - name: protocol_adapter_dispatch
    id: GTW-007
    severity: error
    level: error
    description: 按 sdkClient 选择对应 ProtocolAdapter（llm | image | video | replicate），支持多 provider 路由
    enforcement: TaskExecutionService 通过 ProviderService.getAvailableProviders 获取渠道列表，按 sdkClient 选择适配器
    test: 应根据 provider.sdkClient 获取适配器
  - name: llm_streaming
    id: GTW-008
    severity: error
    level: error
    description: LLM 文本生成必须通过 SSE 流式返回，不创建 Task
    enforcement: chat 操作使用 LLMClient.stream() + SSE response
    test: should stream LLM response via SSE
  - name: multi_provider_priority_routing
    id: GTW-009
    severity: error
    level: error
    description: 模型有多个可用 provider 时按 priority 升序选择，失败时自动 fallback 到下一个渠道
    enforcement: TaskExecutionService 遍历 providers 列表，成功后 break，失败后继续下一个
    test: 第一个 provider 失败时应 fallback 到第二个
  - name: provider_cost_tracking
    id: GTW-010
    severity: error
    level: error
    description: provider 单次和按秒采购成本记录到 providerAttempts 用于利润分析
    enforcement: TaskExecutionService.recordProviderAttempt 写入 costPerCall 和 costPerSecond 字段
    test: providerAttempt 记录包含 Provider 的单次和按秒采购成本
  - name: database_model_route_source
    id: GTW-011
    severity: error
    level: error
    description: 默认模型必须从 capability_model_routes 和启用的 ai_models 中解析
    enforcement: ModelRoutingService.getDefaultModel 按启用路由 priority 和模型 sortOrder 查询数据库
    test: model-routing.service.test.ts 返回首个启用路由模型及数据库 costCredits
  - name: no_runtime_memory_model_fallback
    id: GTW-012
    severity: error
    level: error
    description: 数据库缺失或查询失败时不得构造内存模型或默认成本，查询失败必须返回服务不可用
    enforcement: GatewayService 的模型查询和默认解析仅使用数据库服务，数据库异常抛出 ServiceUnavailableException
    test: gateway.regression.test.ts 数据库查询失败返回服务不可用且不返回内存模型
  - name: provider_records_required
    id: GTW-013
    severity: error
    level: error
    description: 模型执行必须至少存在一个启用的 model_providers 渠道
    enforcement: ProviderService 仅返回 modelProviders 表中启用渠道，无隐式 fallback
    test: provider.service.test.ts 无启用 Provider 时返回空列表
  - name: model_capability_match
    id: GTW-014
    severity: error
    level: error
    description: 显式模型和默认路由模型都必须声明支持请求能力
    enforcement: GatewayService 和 ModelConfigService 在提交或配置路由前校验 capabilities
    test: gateway.service.test.ts 拒绝不支持请求能力的显式模型
  - name: seed_preserves_admin_configuration
    id: GTW-015
    severity: error
    level: error
    description: 启动种子只补齐缺失记录，不得覆盖或重新激活管理员配置
    enforcement: 路由替换保留未选路由为停用状态，seedModels 和独立 seed 脚本逐条 insert on conflict do nothing
    test: 事务化替换能力路由并按提交顺序持久化 priority
  - name: model_slug_immutable
    id: GTW-016
    severity: error
    level: error
    description: 逻辑模型 slug 创建后不可修改，模型下线使用 isActive
    enforcement: UpdateModelSchema 不包含 slug 且 ModelConfigService 不提供模型硬删除
    test: model-config.service.test.ts 更新模型时保持 slug 不变
seed_data:
  models:
    - slug: doubao-seed-2-0-pro
      name: 豆包 Seed 2.0 Pro
      providerName: coze
      modality: text_generation
      sdkModelId: doubao-seed-2-0-pro-250515
      sdkClient: llm
      capabilitySlug: text_generation
      contextWindow: 64000
      maxOutputTokens: 8000
      inputModes:
        - text
        - image_url
      outputType: text
      costCredits: 5
