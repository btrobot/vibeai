domain: gateway
version: '4.7'
last_updated: '2026-08-18'
entities:
  - name: AICapability
    table: ai_capabilities
    description: AI 能力定义
    fields:
      - name: id
        type: uuid
        pk: true
        default: gen_random_uuid()
      - name: slug
        type: varchar(100)
        notNull: true
        unique: true
      - name: name
        type: varchar(255)
        notNull: true
      - name: description
        type: text
        nullable: true
      - name: category
        type: varchar(50)
        notNull: true
      - name: icon
        type: text
        nullable: true
      - name: inputSchema
        type: jsonb
        default: '{}'
        desc: '能力输入契约 JSON Schema；图片类能力可含 refImageRoles（参考图槽位语义列表，每项 {role,label,max}，如模特换装 = [{role:model,label:模特图,max:1},{role:garment,label:衣服图,max:1}]），供前端渲染带标签的上传槽位'

      - name: outputSchema
        type: jsonb
        default: '{}'
      - name: config
        type: jsonb
        default: '{}'
      - name: isActive
        type: boolean
        notNull: true
        default: true
      - name: sortOrder
        type: integer
        notNull: true
        default: 0
      - name: createdAt
        type: timestamp
        notNull: true
        default: now()
      - name: updatedAt
        type: timestamp
        notNull: true
        default: now()
    indexes:
      - name: ai_capabilities_slug_idx
        fields:
          - slug
      - name: ai_capabilities_category_idx
        fields:
          - category
    timestamps: true
  - name: AIModel
    table: ai_models
    description: AI 模型注册表
    fields:
      - name: id
        type: uuid
        pk: true
        default: gen_random_uuid()
      - name: slug
        type: varchar(100)
        notNull: true
        unique: true
      - name: name
        type: varchar(255)
        notNull: true
      - name: providerName
        type: varchar(100)
        notNull: true
        default: coze
        desc: 兼容占位字段（创建时自动填 unconfigured）。模型不绑定供应商，运行时以渠道所属平台为准
      - name: modality
        type: varchar(50)
        notNull: true
        desc: llm | image | video
      - name: sdkModelId
        type: varchar(200)
        notNull: true
        desc: 兼容占位字段（创建时自动填 slug）。SDK 调用使用的模型 ID 以渠道 sdkModelId 为准
      - name: sdkClient
        type: varchar(50)
        notNull: true
        default: llm
        desc: 兼容占位字段（创建时自动填 modality）。协议适配器以渠道 sdkClient 为准（llm | image | video | replicate | openai）
      - name: capabilities
        type: text[]
        default: '[]'
        desc: 支持的能力 slug 列表
      - name: description
        type: text
        nullable: true
      - name: avatar
        type: text
        nullable: true
      - name: contextWindow
        type: integer
        nullable: true
        desc: LLM 上下文窗口大小
      - name: maxOutputTokens
        type: integer
        nullable: true
      - name: inputModes
        type: text[]
        default: '[]'
        desc: 支持的输入类型 text|image_url|video_url
      - name: outputType
        type: varchar(50)
        notNull: true
        desc: 输出类型 text|image|video
      - name: constraints
        type: jsonb
        default: '{}'
        desc: 模型约束（图片尺寸、视频时长等）
      - name: inputSchema
        type: jsonb
        default: '{}'
        desc: 输入参数 JSON Schema（参考 Replicate model.input_schema）
      - name: defaultParams
        type: jsonb
        default: '{}'
        desc: 默认参数（temperature, size, duration 等）
      - name: costCredits
        type: integer
        notNull: true
        default: 1
        desc: 每次调用消耗的信用额度
      - name: tags
        type: text[]
        default: '[]'
      - name: isActive
        type: boolean
        notNull: true
        default: true
      - name: isFeatured
        type: boolean
        notNull: true
        default: false
      - name: sortOrder
        type: integer
        notNull: true
        default: 0
      - name: createdAt
        type: timestamp
        notNull: true
        default: now()
      - name: updatedAt
        type: timestamp
        notNull: true
        default: now()
    indexes:
      - name: ai_models_slug_idx
        fields:
          - slug
      - name: ai_models_modality_idx
        fields:
          - modality
      - name: ai_models_active_idx
        fields:
          - isActive
    timestamps: true
  - name: ProviderAttempt
    table: provider_attempts
    description: SDK 调用审计日志
    fields:
      - name: id
        type: uuid
        pk: true
        default: gen_random_uuid()
      - name: taskId
        type: uuid
        notNull: true
        fk:
          table: tasks
          field: id
          onDelete: cascade
      - name: modelSlug
        type: varchar(100)
        notNull: true
      - name: providerName
        type: varchar(100)
        notNull: true
        default: coze
      - name: sdkClient
        type: varchar(50)
        notNull: true
      - name: requestPayload
        type: jsonb
        notNull: true
        desc: 发送给 SDK 的请求参数
      - name: responsePayload
        type: jsonb
        nullable: true
        desc: SDK 返回的响应
      - name: status
        type: varchar(20)
        notNull: true
        default: pending
        desc: pending | success | failed | timeout
      - name: errorMessage
        type: text
        nullable: true
      - name: durationMs
        type: integer
        nullable: true
        desc: 调用耗时（毫秒）
      - name: attemptNumber
        type: integer
        notNull: true
        default: 1
      - name: costPerCall
        type: numeric(10,4)
        nullable: true
        desc: 单次调用采购成本（美元），用于利润分析
      - name: costPerSecond
        type: numeric(10,4)
        nullable: true
        desc: 按秒采购成本（美元），用于视频和音频利润分析
      - name: startedAt
        type: timestamp
        notNull: true
        default: now()
      - name: completedAt
        type: timestamp
        nullable: true
      - name: createdAt
        type: timestamp
        notNull: true
        default: now()
    indexes:
      - name: provider_attempts_task_id_idx
        fields:
          - taskId
      - name: provider_attempts_model_slug_idx
        fields:
          - modelSlug
      - name: provider_attempts_status_idx
        fields:
          - status
    timestamps: false
  - name: AIPlatform
    table: ai_platforms
    description: 平台共享账号（baseUrl/apiKey 的默认存放处，渠道未覆盖时继承）
    fields:
      - name: id
        type: uuid
        pk: true
        default: gen_random_uuid()
      - name: name
        type: varchar(100)
        notNull: true
        unique: true
        desc: 平台名称（doubao | replicate | pptoken | ...）
      - name: baseUrl
        type: varchar(500)
        nullable: true
        desc: 平台默认网关地址
      - name: apiKey
        type: text
        nullable: true
        desc: 平台默认密钥（运行时在 Admin 配置，不回显）
      - name: isActive
        type: boolean
        notNull: true
        default: true
      - name: createdAt
        type: timestamp
        notNull: true
        default: now()
      - name: updatedAt
        type: timestamp
        notNull: true
        default: now()
    indexes:
      - name: ai_platforms_name_uidx
        unique: true
        fields:
          - name
      - name: ai_platforms_active_idx
        fields:
          - isActive
    timestamps: true
  - name: ModelChannel
    table: model_channels
    description: 渠道实例（平台 × 逻辑模型 × 协议）。key 解析：渠道 config > 平台 apiKey（模型不参与 key/连接配置）
    fields:
      - name: id
        type: uuid
        pk: true
        default: gen_random_uuid()
      - name: platformId
        type: uuid
        notNull: true
        fk:
          table: ai_platforms
          field: id
          onDelete: cascade
        desc: 归属平台
      - name: modelSlug
        type: varchar(100)
        notNull: true
        fk:
          table: ai_models
          field: slug
          onDelete: cascade
        desc: 关联的逻辑模型 slug
      - name: sdkModelId
        type: varchar(200)
        notNull: true
        desc: 渠道侧模型标识（如 owner/model:hash）
      - name: sdkClient
        type: varchar(50)
        notNull: true
        desc: 适配器标识（llm | image | video | replicate | openai）
      - name: priority
        type: integer
        notNull: true
        default: 1
        desc: 优先级（数字越小优先级越高）
      - name: costPerCall
        type: numeric(10,4)
        nullable: true
        desc: 单次调用采购成本（美元）
      - name: costPerSecond
        type: numeric(10,4)
        nullable: true
        desc: 按秒计费成本（美元，视频/音频）
      - name: config
        type: jsonb
        default: '{}'
        desc: 渠道级覆盖配置（仅 baseUrl/apiKey，覆盖平台默认）
      - name: isActive
        type: boolean
        notNull: true
        default: true
      - name: createdAt
        type: timestamp
        notNull: true
        default: now()
      - name: updatedAt
        type: timestamp
        notNull: true
        default: now()
    indexes:
      - name: model_channels_platform_id_idx
        fields:
          - platformId
      - name: model_channels_model_slug_idx
        fields:
          - modelSlug
      - name: model_channels_active_idx
        fields:
          - isActive
      - name: model_channels_model_priority_idx
        fields:
          - modelSlug
          - priority
      - name: model_channels_identity_uidx
        unique: true
        fields:
          - platformId
          - modelSlug
          - sdkModelId
    timestamps: true
  - name: CapabilityModelRoute
    table: capability_model_routes
    description: 能力到逻辑模型的默认路由顺序
    fields:
      - name: id
        type: uuid
        pk: true
        default: gen_random_uuid()
      - name: capabilitySlug
        type: varchar(100)
        notNull: true
        desc: 代码能力注册表中的能力 slug
      - name: modelSlug
        type: varchar(100)
        notNull: true
        fk:
          table: ai_models
          field: slug
          onDelete: cascade
        desc: 关联的逻辑模型 slug
      - name: priority
        type: integer
        notNull: true
        default: 1
        desc: 数字越小越优先，首个有效路由为默认模型
      - name: isActive
        type: boolean
        notNull: true
        default: true
      - name: createdAt
        type: timestamp
        notNull: true
        default: now()
      - name: updatedAt
        type: timestamp
        notNull: true
        default: now()
    indexes:
      - name: capability_model_routes_capability_model_uidx
        fields:
          - capabilitySlug
          - modelSlug
      - name: capability_model_routes_lookup_idx
        fields:
          - capabilitySlug
          - isActive
          - priority
    timestamps: true
operations:
  - name: listCapabilities
    method: GET
    path: /gateway/capabilities
    description: 获取 AI 能力列表
    auth: jwt
    pre:
      - 用户已登录
    post:
      - 返回激活的 AICapability 列表（按 sortOrder 排序）
    test: true
  - name: getCapabilityDetail
    method: GET
    path: /gateway/capabilities/:slug
    description: 获取能力详情
    auth: jwt
    pre:
      - 用户已登录
    post:
      - 返回 AICapability + 关联的 AIModel 列表
    errors:
      - status: 404
        condition: 能力不存在
        message: AI 能力不存在
    test: true
  - name: listModels
    method: GET
    path: /gateway/models
    description: 获取模型列表
    auth: jwt
    pre:
      - 用户已登录
    post:
      - 返回激活的 AIModel 列表，支持 ?capability=xxx 过滤
    test: true
  - name: getModelDetail
    method: GET
    path: /gateway/models/:slug
    description: 获取模型详情（含 inputSchema）
    auth: jwt
    pre:
      - 用户已登录
    post:
      - 返回 AIModel 详情
    errors:
      - status: 404
        condition: 模型不存在
        message: AI 模型不存在
    test: true
  - name: submitGeneration
    method: POST
    path: /gateway/generate
    description: 提交生成任务（图片/视频）
    auth: jwt
    input:
      projectId: { type: string, format: uuid }
      capabilitySlug: { type: string }
      modelSlug: { type: string }
      prompt: { type: string }
      referenceImages:
        type: array
        maxItems: 9
        items:
          type: object
          properties:
            fileId: { type: string, format: uuid }
            role:
              type: string
              enum: [target, subject, product, scene, model, garment]
              description: 参考图槽位角色（对齐能力 inputSchema.refImageRoles）；用户手动选择能力时按槽位顺序分配，自动识别模式可省略（无 role = 通用参考图，按数组顺序传给适配器）
        description: 多参考图 fileId 引用数组（运行时解析 fileId→URL 后传给 AI 适配器）；无参考图时省略该字段，与 referenceImage 单图兼容
      referenceVideos:
        type: array
        maxItems: 3
        items: { type: object, properties: { fileId: { type: string, format: uuid } } }
        description: 参考视频 fileId 引用数组（风格克隆 style-cloning 必填 referenceVideo；运行时解析 fileId→URL 传给 AI 适配器）
      referenceAudios:
        type: array
        maxItems: 3
        items: { type: object, properties: { fileId: { type: string, format: uuid } } }
        description: 参考音频 fileId 引用数组（可选）
      firstFrame:
        type: object
        properties: { fileId: { type: string, format: uuid } }
        description: 视频生成首帧图 fileId 引用（图生视频；video-generation 可选，与 referenceImages 语义互斥；运行时解析 fileId→URL 后传给 AI 适配器 image_url）
      referenceImage:
        type: object
        properties: { fileId: { type: string, format: uuid } }
        description: 单参考图兼容字段（遗留快照恢复用），新提交请优先使用 referenceImages
    pre:
      - 用户已登录
      - 信用额度充足（预扣）
      - modelSlug 对应模型存在且 active
    effect:
      - 创建 Task 记录（type=capabilitySlug, status=queued）
      - 调用 BillingService.reserveCredits 预扣信用
      - 异步执行 ProtocolAdapter
      - 结果转存到 StorageObject
      - 调用 BillingService.settleCredits 结算
    errors:
      - status: 400
        condition: 信用额度不足
        message: 信用额度不足
      - status: 404
        condition: 模型不存在
        message: AI 模型不存在
      - status: 422
        condition: 输入参数不符合 inputSchema
        message: 输入参数校验失败
    test: true
  - name: chat
    method: POST
    path: /gateway/chat
    description: LLM 文本生成（SSE 流式）
    auth: jwt
    pre:
      - 用户已登录
      - 信用额度充足
    effect:
      - 直接调用 LLMClient.stream()
      - 通过 SSE 流式返回
      - 不创建 Task 记录
      - 按实际 Token 消耗结算信用
    errors:
      - status: 400
        condition: 信用额度不足
        message: 信用额度不足
      - status: 404
        condition: 模型不存在
        message: AI 模型不存在
    test: true
  - name: quickCreate
    method: POST
    path: /gateway/quick-create
    description: 快捷创作（预设 Recipe + 参数合并）
    auth: jwt
    pre:
      - 用户已登录
      - 信用额度充足
    effect:
      - 根据 recipeId 查找预设配置
      - 合并用户输入参数
      - 调用 submitGeneration
    errors:
      - status: 404
        condition: Recipe 不存在
        message: 快捷创作方案不存在
      - status: 400
        condition: 信用额度不足
        message: 信用额度不足
    test: true
  - name: listRecipes
    method: GET
    path: /gateway/recipes
    description: 获取快捷创作方案列表
    auth: jwt
    pre:
      - 用户已登录
    effect:
      - 返回所有预设快捷创作方案（按 sortOrder 排序）
    test: true
  - name: toggleModel
    method: POST
    path: /gateway/admin/models/:slug/toggle
    description: 启用/禁用 AI 模型
    auth: jwt
    pre:
      - 用户已登录
      - 当前用户为管理员
    effect:
      - 翻转 AIModel.isActive
      - 记录审计日志
    errors:
      - status: 404
        condition: 模型不存在
        message: 模型不存在
    test: true
  - name: toggleChannel
    method: POST
    path: /gateway/admin/channels/:id/toggle
    description: 启用/禁用渠道
    auth: jwt
    pre:
      - 用户已登录
      - 当前用户为管理员
    effect:
      - 翻转 model_channels.isActive
      - 记录审计日志
    errors:
      - status: 404
        condition: 渠道不存在
        message: 渠道不存在
    test: true
  - name: getModelConfiguration
    method: GET
    path: /admin/model-config
    description: 获取模型、平台、渠道和默认路由聚合配置
    auth: jwt
    pre:
      - 当前用户为管理员
    post:
      - 返回全部模型、平台、渠道、能力和路由
    test: true
  - name: createConfiguredModel
    method: POST
    path: /admin/model-config/models
    description: 创建逻辑模型
    auth: jwt
    pre:
      - 当前用户为管理员
      - slug 全局唯一
    effect:
      - 创建 AIModel
    errors:
      - status: 409
        condition: slug 已存在
        message: 模型 slug 已存在
        test: model-config.service.test.ts 拒绝重复 slug
    test: true
  - name: updateConfiguredModel
    method: PATCH
    path: /admin/model-config/models/:slug
    description: 更新逻辑模型可编辑配置
    auth: jwt
    pre:
      - 当前用户为管理员
      - slug 不可修改
    effect:
      - 更新名称、能力、成本、约束和展示配置
    test: true
  - name: setConfiguredModelStatus
    method: PATCH
    path: /admin/model-config/models/:slug/status
    description: 设置逻辑模型启停状态
    auth: jwt
    pre:
      - 当前用户为管理员
      - 停用当前默认模型时存在同能力的其他有效路由
    effect:
      - 更新 AIModel.isActive
    errors:
      - status: 409
        condition: 模型是能力的唯一有效默认路由
        message: 请先配置替代默认模型
        test: model-config.service.test.ts 阻止停用唯一默认模型
    test: true
  - name: createConfiguredPlatform
    method: POST
    path: /admin/model-config/platforms
    description: 创建平台（共享账号）
    auth: jwt
    pre:
      - 当前用户为管理员
      - 平台名称全局唯一
    effect:
      - 创建 AIPlatform
    errors:
      - status: 409
        condition: 平台名称已存在
        message: 平台名称已存在
        test: model-config.service.test.ts 拒绝重复平台名称
    test: true
  - name: updateConfiguredPlatform
    method: PATCH
    path: /admin/model-config/platforms/:id
    description: 更新平台 baseUrl/apiKey 等配置
    auth: jwt
    pre:
      - 当前用户为管理员
    effect:
      - 更新 AIPlatform（apiKey 留空保留旧值，不回显）
    test: true
  - name: setConfiguredPlatformStatus
    method: PATCH
    path: /admin/model-config/platforms/:id/status
    description: 设置平台启停状态
    auth: jwt
    pre:
      - 当前用户为管理员
    effect:
      - 更新 AIPlatform.isActive
    test: true
  - name: deleteConfiguredPlatform
    method: DELETE
    path: /admin/model-config/platforms/:id
    description: 删除平台（级联删除其全部渠道）
    auth: jwt
    pre:
      - 当前用户为管理员
    effect:
      - 删除 AIPlatform 及其全部渠道
    test: true
  - name: createConfiguredChannel
    method: POST
    path: /admin/model-config/channels
    description: 为平台 × 逻辑模型创建渠道实例
    auth: jwt
    pre:
      - 当前用户为管理员
      - 渠道组合标识（平台 × 模型 × sdkModelId）唯一
    effect:
      - 创建 ModelChannel
    errors:
      - status: 409
        condition: 渠道组合标识已存在
        message: 渠道组合标识（平台 × 模型 × sdkModelId）已存在
        test: model-config.service.test.ts 拒绝重复渠道组合标识
    test: true
  - name: updateConfiguredChannel
    method: PATCH
    path: /admin/model-config/channels/:id
    description: 更新渠道配置
    auth: jwt
    pre:
      - 当前用户为管理员
    effect:
      - 更新 SDK 模型、优先级、采购成本和渠道参数（config 合并保留旧 key）
    test: true
  - name: setConfiguredChannelStatus
    method: PATCH
    path: /admin/model-config/channels/:id/status
    description: 设置渠道启停状态
    auth: jwt
    pre:
      - 当前用户为管理员
    effect:
      - 更新 ModelChannel.isActive
    test: true
  - name: deleteConfiguredChannel
    method: DELETE
    path: /admin/model-config/channels/:id
    description: 删除渠道实例
    auth: jwt
    pre:
      - 当前用户为管理员
    effect:
      - 删除 ModelChannel
    test: true
  - name: replaceCapabilityRoutes
    method: PUT
    path: /admin/model-config/routes/:capabilitySlug
    description: 原子替换指定能力的有序模型路由
    auth: jwt
    pre:
      - 当前用户为管理员
      - 至少提交一个启用且支持该能力的模型
    effect:
      - 在事务中替换该能力全部路由并顺序写入 priority
    errors:
      - status: 422
        condition: 模型不支持目标能力或路由为空
        message: 路由配置无效
        test: model-config.service.test.ts 拒绝空路由和能力不匹配模型
    test: true
rules:
  - name: capability_slug_unique
    id: GTW-001
    severity: error
    level: error
    description: AI 能力 slug 全局唯一
    enforcement: DB unique 约束
    test: getCapability 按 slug 返回正确的能力
  - name: model_slug_unique
    id: GTW-002
    severity: error
    level: error
    description: AI 模型 slug 全局唯一
    enforcement: DB unique 约束
    test: getModel 按 slug 返回正确的模型
  - name: model_capability_valid
    id: GTW-004
    severity: error
    level: error
    description: 提交生成任务时 modelSlug 必须对应一个 active 的 AIModel
    enforcement: submitGeneration 中校验 model 存在且 isActive=true
    test: 不存在的能力抛出 NotFoundException
  - name: credit_reserve_before_submit
    id: GTW-005
    severity: error
    level: error
    description: 提交生成任务前必须预扣信用额度（reserve 而非仅检查）
    enforcement: submitGeneration 先调 BillingService.reserveCredits 再创建 Task
    test: 信用不足时返回 400 并拒绝创建
  - name: result_persist
    id: GTW-006
    severity: error
    level: error
    description: 生成结果必须转存到 StorageObject，不直接暴露外部 URL
    enforcement: ProtocolAdapter 执行成功后调用 StorageService.persistFromUrl
    test: should persist generated results
  - name: protocol_adapter_dispatch
    id: GTW-007
    severity: error
    level: error
    description: 按 sdkClient 选择对应 ProtocolAdapter（llm | image | video | replicate | openai），支持多渠道路由与故障切换
    enforcement: TaskExecutionService 通过 ProviderService.getAvailableProviders 获取渠道列表，按 sdkClient 选择适配器
    test: 应根据 provider.sdkClient 获取适配器
  - name: llm_streaming
    id: GTW-008
    severity: error
    level: error
    description: LLM 文本生成必须通过 SSE 流式返回，不创建 Task
    enforcement: chat 操作使用 LLMClient.stream() + SSE response
    test: should stream LLM response via SSE
  - name: multi_provider_priority_routing
    id: GTW-009
    severity: error
    level: error
    description: 模型有多个可用 provider 时按 priority 升序选择，失败时自动 fallback 到下一个渠道
    enforcement: TaskExecutionService 遍历 providers 列表，成功后 break，失败后继续下一个
    test: 第一个 provider 失败时应 fallback 到第二个
  - name: provider_cost_tracking
    id: GTW-010
    severity: error
    level: error
    description: provider 单次和按秒采购成本记录到 providerAttempts 用于利润分析
    enforcement: TaskExecutionService.recordProviderAttempt 写入 costPerCall 和 costPerSecond 字段
    test: providerAttempt 记录包含 Provider 的单次和按秒采购成本
  - name: database_model_route_source
    id: GTW-011
    severity: error
    level: error
    description: 默认模型必须从 capability_model_routes 和启用的 ai_models 中解析
    enforcement: ModelRoutingService.getDefaultModel 按启用路由 priority 和模型 sortOrder 查询数据库
    test: model-routing.service.test.ts 返回首个启用路由模型及数据库 costCredits
  - name: no_runtime_memory_model_fallback
    id: GTW-012
    severity: error
    level: error
    description: 数据库缺失或查询失败时不得构造内存模型或默认成本，查询失败必须返回服务不可用
    enforcement: GatewayService 的模型查询和默认解析仅使用数据库服务，数据库异常抛出 ServiceUnavailableException
    test: gateway.regression.test.ts 数据库查询失败返回服务不可用且不返回内存模型
  - name: provider_records_required
    id: GTW-013
    severity: error
    level: error
    description: 模型执行必须至少存在一个启用的 model_channels 渠道
    enforcement: ProviderService 仅返回 model_channels 表中启用渠道（且平台启用），无隐式 fallback
    test: provider.service.test.ts 无启用渠道时返回空列表
  - name: model_capability_match
    id: GTW-014
    severity: error
    level: error
    description: 显式模型和默认路由模型都必须声明支持请求能力
    enforcement: GatewayService 和 ModelConfigService 在提交或配置路由前校验 capabilities
    test: gateway.service.test.ts 拒绝不支持请求能力的显式模型
  - name: seed_preserves_admin_configuration
    id: GTW-015
    severity: error
    level: error
    description: 启动种子只补齐缺失记录，不得覆盖或重新激活管理员配置
    enforcement: 路由替换保留未选路由为停用状态，seedModels 和独立 seed 脚本逐条 insert on conflict do nothing
    test: 事务化替换能力路由并按提交顺序持久化 priority
  - name: model_slug_immutable
    id: GTW-016
    severity: error
    level: error
    description: 逻辑模型 slug 创建后不可修改，模型下线使用 isActive
    enforcement: UpdateModelSchema 不包含 slug 且 ModelConfigService 不提供模型硬删除
    test: model-config.service.test.ts 更新模型时保持 slug 不变
  - name: api_key_resolution_chain
    id: GTW-017
    severity: error
    level: error
    description: key 二级解析：渠道 config.apiKey > 平台 apiKey；模型不参与 key 配置（模型 defaultParams 仅业务参数，内嵌密钥在执行时被剔除）；两级均未配置时适配器直接报错，不得 Mock
    enforcement: 任务执行与 chat 流式链路（chatStream 与 TaskExecutionService）合并 { ...stripKeys(模型 defaultParams), ...provider.config } 后传给适配器，其中 provider.config 由 ProviderService 以平台默认 + 渠道覆盖合并；OpenAIAdapter/ReplicateAdapter/Coze 适配器在未配置 apiKey 时抛「配置不完整」异常
    test: 平台级 key 作为默认传给适配器
  - name: channel_identity_unique
    id: GTW-018
    severity: error
    level: error
    description: 渠道组合标识（platformId × modelSlug × sdkModelId）全局唯一
    enforcement: assertChannelIdentityAvailable 校验 platformId × modelSlug × sdkModelId 组合唯一且 model_channels_identity_uidx 唯一索引兜底
    test: 拒绝重复渠道组合标识
  - name: platform_name_unique
    id: GTW-019
    severity: error
    level: error
    description: 平台名称全局唯一
    enforcement: assertPlatformNameAvailable 校验平台名称唯一且 ai_platforms_name_uidx 唯一索引兜底
    test: 拒绝重复平台名称
  - name: api_key_redaction
    id: GTW-020
    severity: error
    level: error
    description: 平台 apiKey / 渠道 config 中的密钥任何出口均不回显，仅暴露 apiKeyConfigured 标记；模型 defaultParams 不参与 key 配置，其出口脱敏同时剔除密钥与 baseUrl（兜底历史数据）
    enforcement: sanitizePlatform/sanitizeChannel 与 gateway 出口脱敏（omitSensitiveConfig 递归移除敏感字段）
    test: 读取配置时平台 apiKey 不回显
  - name: platform_delete_cascade
    id: GTW-021
    severity: error
    level: error
    description: 删除平台必须级联删除其全部渠道，渠道不得脱离平台孤立存在
    enforcement: deletePlatform 删除平台，FK ON DELETE CASCADE 级联清理 model_channels
    test: 删除平台
  - name: route_model_channel_available
    id: GTW-022
    severity: error
    level: error
    description: 默认路由解析跳过无启用渠道（或其平台停用）的模型并继续下一路由（路由级 fallback）；渠道级 fallback 在任务执行/chat 层继续生效
    enforcement: ModelRoutingService.getDefaultModel 通过 exists 子查询校验模型存在启用渠道，按路由 priority 顺序返回首个可用模型
    test: model-routing.service.test.ts 首选路由模型没有启用渠道时跳过该模型（路由级 fallback）
  - name: cost_dual_track
    id: GTW-023
    severity: error
    level: error
    description: 面向用户的信用成本（模型 costCredits，预扣/结算）与渠道采购成本（costPerCall/costPerSecond，利润分析）分离核算
    enforcement: TaskExecutionService 以模型 costCredits 预扣与结算信用，recordProviderAttempt 将渠道采购成本写入 provider_attempts
    test: providerAttempt 记录包含 Provider 的单次和按秒采购成本
  - name: incomplete_channel_filter
    id: GTW-024
    severity: error
    level: error
    description: 渠道筛选必须过滤参数不完整的渠道，避免无效 fallback 产生误导性报错（openai 需合并后 apiKey 非空；replicate 需进程环境 REPLICATE_API_TOKEN；coze 协议 image/llm/video 需进程环境 COZE_LOOP_API_TOKEN/COZE_WORKLOAD_API_TOKEN；未知协议不过滤，由适配器自身校验）
    enforcement: ProviderService.getAvailableProviders 在返回渠道列表前按 sdkClient 判定参数完整性并过滤；被过滤渠道记录 warn 日志
    test: provider.service.test.ts 多渠道时仅返回参数完整的渠道（不完整渠道被过滤且不影响其余渠道）
seed_data:
  # 权威来源：server/src/modules/gateway/seeds/model-seeds.ts
  # 生成方式：node --import tsx /tmp/dump-seeds.ts | node -e "js-yaml dump"
  # 平台/渠道：SEED_PLATFORMS（按模型 providerName 去重）+ SEED_CHANNELS（每模型一个渠道，config 空继承平台）
  # 平台 key/baseUrl 不在种子中硬编码，运行时在 Admin 后台配置（效率优先，明文存 DB）
  # L1/L2 分层（2026-08 产品共识，对齐 RunningHub）：
  #   L1 生成层：image-generation（文生图，无参考图）/ image-editing（图片编辑，多参考图无 role，语义由 prompt 描述）
  #     → 前端 UI 无能力选择器（纯自动识别），判定由"参考图有无"驱动，无正则
  #   L2 后处理层：background-removal（白底）/ scene-composition（场景）/ model-dressing（换装）
  #     → "结果图附加操作"语义，本期不启用（enabled: false），历史数据仅渲染不可新建
  # refImageRoles 仅属 L2 操作语义（历史/未来文档），L1 不消费；前端无对应常量（见 image-capability-consistency 测试）
  capabilities:
    # 2026-08 产品决策：图片创作收敛为两条路 —— 无参考图 → 文生图（image-generation）、
    # 有参考图 → 图片编辑（image-editing，多参考图无 role，语义由 prompt 描述）。
    # UI 无能力选择器（纯自动识别），判定由参考图有无驱动，无正则。
    # 白底图/场景合成/模特换装 屏蔽新建入口（enabled: false），历史数据仍可读取渲染。
    - slug: image-generation
      enabled: true
      refImageRoles: []
    - slug: image-editing
      enabled: true
      refImageRoles: []
    - slug: background-removal
      enabled: false
      refImageRoles:
        - { role: subject, label: 商品图, max: 1 }
    - slug: scene-composition
      enabled: false
      refImageRoles:
        - { role: product, label: 商品图, max: 1 }
        - { role: scene, label: 场景图, max: 1 }
    - slug: model-dressing
      enabled: false
      refImageRoles:
        - { role: model, label: 模特图, max: 1 }
        - { role: garment, label: 衣服图, max: 1 }
