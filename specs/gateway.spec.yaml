    - slug: glm-5-0
      name: 智谱 GLM 5.0
      providerName: coze
      modality: text_generation
      sdkModelId: glm-5-0-250518
      sdkClient: llm
      capabilitySlug: text_generation
      contextWindow: 128000
      maxOutputTokens: 8000
      inputModes:
        - text
        - image_url
      outputType: text
      costCredits: 4
