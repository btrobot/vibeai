domain: gateway
version: '2.0'
last_updated: '2025-01-15'
entities:
  - name: AICapability
    table: ai_capabilities
    description: AI 能力定义
    fields:
      - name: id
        type: uuid
        pk: true
        default: gen_random_uuid()
      - name: slug
        type: varchar(100)
        notNull: true
        unique: true
      - name: name
        type: varchar(255)
        notNull: true
      - name: description
        type: text
        nullable: true
      - name: category
        type: varchar(50)
        notNull: true
      - name: icon
        type: text
        nullable: true
      - name: inputSchema
        type: jsonb
        default: '{}'
      - name: outputSchema
        type: jsonb
        default: '{}'
      - name: config
        type: jsonb
        default: '{}'
      - name: isActive
        type: boolean
        notNull: true
        default: true
      - name: sortOrder
        type: integer
        notNull: true
        default: 0
      - name: createdAt
        type: timestamp
        notNull: true
        default: now()
      - name: updatedAt
        type: timestamp
        notNull: true
        default: now()
    indexes:
      - name: ai_capabilities_slug_idx
        fields:
          - slug
      - name: ai_capabilities_category_idx
        fields:
          - category
    timestamps: true
  - name: AIModel
    table: ai_models
    description: AI 模型注册表
    fields:
      - name: id
        type: uuid
        pk: true
        default: gen_random_uuid()
      - name: slug
        type: varchar(100)
        notNull: true
        unique: true
      - name: name
        type: varchar(255)
        notNull: true
      - name: providerName
        type: varchar(100)
        notNull: true
        default: coze
        desc: 供应商标识，当前固定为 coze
      - name: modality
        type: varchar(50)
        notNull: true
        desc: text_generation | image_generation | video_generation
      - name: sdkModelId
        type: varchar(200)
        notNull: true
        desc: 传给 Coze SDK 的模型 ID
      - name: sdkClient
        type: varchar(50)
        notNull: true
        default: llm
        desc: llm | image_generation | video_generation
      - name: capabilitySlug
        type: varchar(100)
        notNull: true
        desc: 关联的 AICapability slug
      - name: description
        type: text
        nullable: true
      - name: avatar
        type: text
        nullable: true
      - name: contextWindow
        type: integer
        nullable: true
        desc: LLM 上下文窗口大小
      - name: maxOutputTokens
        type: integer
        nullable: true
      - name: inputModes
        type: text[]
        default: '[]'
        desc: 支持的输入类型 text|image_url|video_url
      - name: outputType
        type: varchar(50)
        notNull: true
        desc: 输出类型 text|image|video
      - name: constraints
        type: jsonb
        default: '{}'
        desc: 模型约束（图片尺寸、视频时长等）
      - name: inputSchema
        type: jsonb
        default: '{}'
        desc: 输入参数 JSON Schema（参考 Replicate model.input_schema）
      - name: defaultParams
        type: jsonb
        default: '{}'
        desc: 默认参数（temperature, size, duration 等）
      - name: costCredits
        type: integer
        notNull: true
        default: 1
        desc: 每次调用消耗的信用额度
      - name: tags
        type: text[]
        default: '[]'
      - name: isActive
        type: boolean
        notNull: true
        default: true
      - name: isFeatured
        type: boolean
        notNull: true
        default: false
      - name: sortOrder
        type: integer
        notNull: true
        default: 0
      - name: createdAt
        type: timestamp
        notNull: true
        default: now()
      - name: updatedAt
        type: timestamp
        notNull: true
        default: now()
    indexes:
      - name: ai_models_slug_idx
        fields:
          - slug
      - name: ai_models_capability_slug_idx
        fields:
          - capabilitySlug
      - name: ai_models_modality_idx
        fields:
          - modality
      - name: ai_models_active_idx
        fields:
          - isActive
    timestamps: true
  - name: ProviderAttempt
    table: provider_attempts
    description: SDK 调用审计日志
    fields:
      - name: id
        type: uuid
        pk: true
        default: gen_random_uuid()
      - name: taskId
        type: uuid
        notNull: true
        fk:
          table: tasks
          field: id
          onDelete: cascade
      - name: modelSlug
        type: varchar(100)
        notNull: true
      - name: providerName
        type: varchar(100)
        notNull: true
        default: coze
      - name: sdkClient
        type: varchar(50)
        notNull: true
      - name: requestPayload
        type: jsonb
        notNull: true
        desc: 发送给 SDK 的请求参数
      - name: responsePayload
        type: jsonb
        nullable: true
        desc: SDK 返回的响应
      - name: status
        type: varchar(20)
        notNull: true
        default: pending
        desc: pending | success | failed | timeout
      - name: errorMessage
        type: text
        nullable: true
      - name: durationMs
        type: integer
        nullable: true
        desc: 调用耗时（毫秒）
      - name: attemptNumber
        type: integer
        notNull: true
        default: 1
      - name: startedAt
        type: timestamp
        notNull: true
        default: now()
      - name: completedAt
        type: timestamp
        nullable: true
      - name: createdAt
        type: timestamp
        notNull: true
        default: now()
    indexes:
      - name: provider_attempts_task_id_idx
        fields:
          - taskId
      - name: provider_attempts_model_slug_idx
        fields:
          - modelSlug
      - name: provider_attempts_status_idx
        fields:
          - status
    timestamps: false
operations:
  - name: listCapabilities
    method: GET
    path: /gateway/capabilities
    description: 获取 AI 能力列表
    auth: jwt
    pre:
      - 用户已登录
    post:
      - 返回激活的 AICapability 列表（按 sortOrder 排序）
    test: true
  - name: getCapabilityDetail
    method: GET
    path: /gateway/capabilities/:slug
    description: 获取能力详情
    auth: jwt
    pre:
      - 用户已登录
    post:
      - 返回 AICapability + 关联的 AIModel 列表
    errors:
      - status: 404
        condition: 能力不存在
        message: AI 能力不存在
    test: true
  - name: listModels
    method: GET
    path: /gateway/models
    description: 获取模型列表
    auth: jwt
    pre:
      - 用户已登录
    post:
      - 返回激活的 AIModel 列表，支持 ?capability=xxx 过滤
    test: true
  - name: getModelDetail
    method: GET
    path: /gateway/models/:slug
    description: 获取模型详情（含 inputSchema）
    auth: jwt
    pre:
      - 用户已登录
    post:
      - 返回 AIModel 详情
    errors:
      - status: 404
        condition: 模型不存在
        message: AI 模型不存在
    test: true
  - name: submitGeneration
    method: POST
    path: /gateway/generate
    description: 提交生成任务（图片/视频）
    auth: jwt
    pre:
      - 用户已登录
      - 信用额度充足（预扣）
      - modelSlug 对应模型存在且 active
    effect:
      - 创建 Task 记录（type=capabilitySlug, status=queued）
      - 调用 BillingService.reserveCredits 预扣信用
      - 异步执行 ProtocolAdapter
      - 结果转存到 StorageObject
      - 调用 BillingService.settleCredits 结算
    errors:
      - status: 402
        condition: 信用额度不足
        message: 信用额度不足
      - status: 404
        condition: 模型不存在
        message: AI 模型不存在
      - status: 422
        condition: 输入参数不符合 inputSchema
        message: 输入参数校验失败
    test: true
  - name: chat
    method: POST
    path: /gateway/chat
    description: LLM 文本生成（SSE 流式）
    auth: jwt
    pre:
      - 用户已登录
      - 信用额度充足
    effect:
      - 直接调用 LLMClient.stream()
      - 通过 SSE 流式返回
      - 不创建 Task 记录
      - 按实际 Token 消耗结算信用
    errors:
      - status: 402
        condition: 信用额度不足
        message: 信用额度不足
      - status: 404
        condition: 模型不存在
        message: AI 模型不存在
    test: true
  - name: quickCreate
    method: POST
    path: /gateway/quick-create
    description: 快捷创作（预设 Recipe + 参数合并）
    auth: jwt
    pre:
      - 用户已登录
      - 信用额度充足
    effect:
      - 根据 recipeId 查找预设配置
      - 合并用户输入参数
      - 调用 submitGeneration
    errors:
      - status: 404
        condition: Recipe 不存在
        message: 快捷创作方案不存在
      - status: 402
        condition: 信用额度不足
        message: 信用额度不足
    test: true
rules:
  - name: capability_slug_unique
    id: GTW-001
    severity: error
    level: error
    description: AI 能力 slug 全局唯一
    enforcement: DB unique 约束
    test: getCapability 按 slug 返回正确的能力
  - name: model_slug_unique
    id: GTW-002
    severity: error
    level: error
    description: AI 模型 slug 全局唯一
    enforcement: DB unique 约束
    test: getModel 按 slug 返回正确的模型
  - name: model_capability_valid
    id: GTW-004
    severity: error
    level: error
    description: 提交生成任务时 modelSlug 必须对应一个 active 的 AIModel
    enforcement: submitGeneration 中校验 model 存在且 isActive=true
    test: 不存在的能力抛出 NotFoundException
  - name: credit_reserve_before_submit
    id: GTW-005
    severity: error
    level: error
    description: 提交生成任务前必须预扣信用额度（reserve 而非仅检查）
    enforcement: submitGeneration 先调 BillingService.reserveCredits 再创建 Task
    test: 信用不足时返回 409 并拒绝创建
  - name: result_persist
    id: GTW-006
    severity: error
    level: error
    description: 生成结果必须转存到 StorageObject，不直接暴露外部 URL
    enforcement: ProtocolAdapter 执行成功后调用 StorageService.persistFromUrl
    test: should persist result to storage
  - name: protocol_adapter_dispatch
    id: GTW-007
    severity: error
    level: error
    description: 根据 model.modality 选择对应 ProtocolAdapter（llm | image_generation | video_generation）
    enforcement: TaskExecutionService 根据 model.sdkClient 字段选择适配器
    test: routeCapability 为 image-generation 返回正确的图片模型
  - name: llm_streaming
    id: GTW-008
    severity: error
    level: error
    description: LLM 文本生成必须通过 SSE 流式返回，不创建 Task
    enforcement: chat 操作使用 LLMClient.stream() + SSE response
    test: should stream LLM response via SSE
