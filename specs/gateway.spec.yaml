      sdkModelId: seedance-2-0-250528
      sdkClient: video_generation
      capabilitySlug: video_generation
      inputModes:
        - text
        - image_url
      outputType: video
      constraints:
        durations:
          - 5
          - 10
        aspectRatios:
          - 16:9
          - 9:16
          - 1:1
      inputSchema:
        type: object
        properties:
          prompt:
            type: string
            description: 视频描述
          duration:
            type: integer
            enum:
              - 5
              - 10
            default: 5
          aspectRatio:
            type: string
            enum:
              - 16:9
              - 9:16
              - 1:1
            default: 16:9
          firstFrame:
            type: string
            description: 首帧图片 URL
          lastFrame:
            type: string
            description: 末帧图片 URL
        required:
          - prompt
      defaultParams:
        duration: 5
        aspectRatio: 16:9
      costCredits: 30
      isFeatured: true
      sortOrder: 20
