domain: billing
version: '1.0'
last_updated: '2025-04-06'
entities:
  - name: SubscriptionPlan
    table: subscription_plans
    description: 订阅套餐定义
    fields:
      - name: id
        type: uuid
        pk: true
        default: gen_random_uuid()
      - name: slug
        type: varchar(50)
        notNull: true
        unique: true
      - name: name
        type: varchar(100)
        notNull: true
      - name: description
        type: text
        nullable: true
      - name: credits
        type: integer
        notNull: true
        default: 0
      - name: priceMonthly
        type: decimal(10,2)
        notNull: true
        default: '0'
      - name: priceYearly
        type: decimal(10,2)
        nullable: true
      - name: maxProjects
        type: integer
        notNull: true
        default: 5
      - name: maxStorageBytes
        type: bigint
        notNull: true
        default: 104857600
      - name: maxConcurrentTasks
        type: integer
        notNull: true
        default: 1
      - name: capabilities
        type: text[]
        default: '[]'
      - name: features
        type: jsonb
        default: '{}'
      - name: isActive
        type: boolean
        notNull: true
        default: true
      - name: sortOrder
        type: integer
        notNull: true
        default: 0
      - name: createdAt
        type: timestamp
        notNull: true
        default: now()
      - name: updatedAt
        type: timestamp
        notNull: true
        default: now()
    indexes:
      - name: plans_slug_idx
        fields:
          - slug
    timestamps: true
  - name: Subscription
    table: subscriptions
    description: 用户订阅
    fields:
      - name: id
        type: uuid
        pk: true
        default: gen_random_uuid()
      - name: userId
        type: uuid
        notNull: true
        fk:
          table: users
          field: id
          onDelete: cascade
      - name: planId
        type: uuid
        notNull: true
        fk:
          table: subscription_plans
          field: id
      - name: status
        type: varchar(20)
        notNull: true
        default: active
      - name: billingCycle
        type: varchar(10)
        notNull: true
        default: monthly
      - name: creditsRemaining
        type: integer
        notNull: true
        default: 0
      - name: creditsUsed
        type: integer
        notNull: true
        default: 0
      - name: currentPeriodStart
        type: timestamp
        notNull: true
        default: now()
      - name: currentPeriodEnd
        type: timestamp
        nullable: true
      - name: stripeSubscriptionId
        type: text
        nullable: true
      - name: stripeCustomerId
        type: text
        nullable: true
      - name: cancelledAt
        type: timestamp
        nullable: true
      - name: trialEndsAt
        type: timestamp
        nullable: true
      - name: autoRenew
        type: boolean
        notNull: true
        default: true
      - name: createdAt
        type: timestamp
        notNull: true
        default: now()
      - name: updatedAt
        type: timestamp
        notNull: true
        default: now()
    indexes:
      - name: subs_user_id_idx
        fields:
          - userId
      - name: subs_plan_id_idx
        fields:
          - planId
      - name: subs_status_idx
        fields:
          - status
    timestamps: true
  - name: CreditUsage
    table: credit_usage
    description: 信用额度使用记录
    fields:
      - name: id
        type: uuid
        pk: true
        default: gen_random_uuid()
      - name: userId
        type: uuid
        notNull: true
        fk:
          table: users
          field: id
          onDelete: cascade
      - name: subscriptionId
        type: uuid
        nullable: true
        fk:
          table: subscriptions
          field: id
      - name: taskId
        type: uuid
        nullable: true
        fk:
          table: tasks
          field: id
          onDelete: set null
      - name: credits
        type: integer
        notNull: true
      - name: action
        type: varchar(50)
        notNull: true
      - name: description
        type: text
        nullable: true
      - name: balanceAfter
        type: integer
        notNull: true
      - name: metadata
        type: jsonb
        default: '{}'
      - name: createdAt
        type: timestamp
        notNull: true
        default: now()
    indexes:
      - name: usage_user_id_idx
        fields:
          - userId
      - name: usage_subscription_id_idx
        fields:
          - subscriptionId
      - name: usage_task_id_idx
        fields:
          - taskId
      - name: usage_created_at_idx
        fields:
          - createdAt
    timestamps: false
  - name: Invoice
    table: invoices
    description: 发票/账单
    fields:
      - name: id
        type: uuid
        pk: true
        default: gen_random_uuid()
      - name: userId
        type: uuid
        notNull: true
        fk:
          table: users
          field: id
          onDelete: cascade
      - name: subscriptionId
        type: uuid
        nullable: true
        fk:
          table: subscriptions
          field: id
      - name: stripeInvoiceId
        type: text
        nullable: true
      - name: amount
        type: decimal(10,2)
        notNull: true
      - name: currency
        type: varchar(3)
        notNull: true
        default: cny
      - name: status
        type: varchar(20)
        notNull: true
        default: pending
      - name: description
        type: text
        nullable: true
      - name: periodStart
        type: timestamp
        nullable: true
      - name: periodEnd
        type: timestamp
        nullable: true
      - name: paidAt
        type: timestamp
        nullable: true
      - name: metadata
        type: jsonb
        default: '{}'
      - name: createdAt
        type: timestamp
        notNull: true
        default: now()
      - name: updatedAt
        type: timestamp
        notNull: true
        default: now()
    indexes:
      - name: invoices_user_id_idx
        fields:
          - userId
      - name: invoices_subscription_id_idx
        fields:
          - subscriptionId
      - name: invoices_status_idx
        fields:
          - status
    timestamps: true
operations:
  - name: listPlans
    method: GET
    path: /billing/plans
    description: 获取所有套餐列表
    auth: none
    post:
      - 返回所有活跃套餐
    test: true
  - name: getPlan
    method: GET
    path: /billing/plans/:slug
    description: 获取套餐详情
    auth: none
    errors:
      - status: 404
        condition: 套餐不存在
        message: Plan not found
    test: true
  - name: getSubscription
    method: GET
    path: /billing/subscription
    description: 获取当前用户订阅
    auth: jwt
    pre:
      - 用户已登录
    post:
      - 返回用户当前订阅信息
    test: true
  - name: subscribe
    method: POST
    path: /billing/subscription
    description: 订阅/切换套餐
    auth: jwt
    pre:
      - 用户已登录
      - 目标套餐存在且活跃
    effect:
      - 创建/更新 Subscription 记录
      - 更新用户信用额度
    errors:
      - status: 400
        condition: 目标套餐不存在
        message: 套餐不存在
    test: true
  - name: cancelSubscription
    method: POST
    path: /billing/subscription/cancel
    description: 取消订阅
    auth: jwt
    pre:
      - 用户已登录
      - 用户有活跃订阅
    effect:
      - 更新 Subscription.status = cancelled
      - 设置 cancelledAt
    test: true
  - name: getUsageStats
    method: GET
    path: /billing/stats
    description: 获取用量统计
    auth: jwt
    pre:
      - 用户已登录
    post:
      - 返回信用使用/剩余统计
    test: true
  - name: getUsageHistory
    method: GET
    path: /billing/history
    description: 获取信用使用历史
    auth: jwt
    pre:
      - 用户已登录
    post:
      - 返回 CreditUsage 记录列表（分页）
    test: true
  - name: deductCredits
    method: N/A
    auth: internal
    path: /
    description: 扣减信用额度（内部操作，由任务执行触发）
    test: true
  - name: refundCredits
    method: N/A
    auth: internal
    path: /
    description: 退还信用额度（内部操作，由任务失败触发）
    test: true
  - name: resetMonthlyCredits
    method: N/A
    auth: internal
    path: /
    description: 每月重置信用额度（Cron 任务）
    test: false
  - name: createCheckout
    method: POST
    path: /billing/checkout
    description: 创建 Stripe Checkout Session（支付准备层）
    auth: jwt
    pre:
      - 用户已登录
      - 支付功能已启用（STRIPE_SECRET_KEY 已配置）
      - 目标套餐非免费套餐
    effect:
      - 创建 Stripe Checkout Session
      - 返回 sessionId 和支付链接
    errors:
      - status: 400
        condition: 支付功能未启用
        message: 支付功能未启用
      - status: 400
        condition: 免费套餐无需支付
        message: 免费套餐无需支付
      - status: 404
        condition: 套餐不存在
        message: 套餐不存在
    test: true
  - name: handlePaymentWebhook
    method: POST
    path: /billing/webhook
    description: 处理 Stripe Webhook 回调
    auth: none
    pre:
      - STRIPE_WEBHOOK_SECRET 已配置
      - 请求签名验证通过
    effect:
      - checkout.session.completed: 创建订阅 + 更新信用额度 + 记录发票
      - invoice.paid: 记录发票（幂等）
    errors:
      - status: 400
        condition: Webhook 签名验证失败
        message: Webhook signature verification failed
    test: true
  - name: getPaymentStatus
    method: GET
    path: /billing/payment-status
    description: 查询支付功能是否启用
    auth: jwt
    pre:
      - 用户已登录
    post:
      - 返回 { enabled: boolean }
    test: true
rules:
  - name: credits_non_negative
    id: BIL-001
    severity: error
    level: error
    description: 信用额度不可为负
    enforcement: 扣减前检查 creditsRemaining >= 0
    test: should return false when user has insufficient credits
  - name: one_subscription_per_user
    id: BIL-002
    severity: error
    level: error
    description: 每个用户同时只能有一个活跃订阅
    enforcement: 订阅前检查是否有活跃订阅
    test: should throw NotFoundException when plan not found
  - name: subscription_required
    id: BIL-003
    severity: error
    level: error
    description: 只有活跃订阅用户可执行付费操作
    enforcement: 检查 subscription.status = active
    test: should return null when no active subscription
  - name: free_plan_always_available
    id: BIL-004
    severity: error
    level: error
    description: 免费套餐始终可用
    enforcement: 免费套餐不可取消
    test: should cancel active subscription
  - name: usage_logging
    id: BIL-005
    severity: error
    level: error
    description: 每次信用操作必须记录 CreditUsage
    enforcement: 扣减/退还时写入 credit_usage 表
    test: should deduct credits successfully
  - name: cancel_grace_period
    id: BIL-006
    severity: error
    level: error
    description: 取消订阅后，当前周期内仍可使用
    enforcement: 取消后 currentPeriodEnd 前不限制
    test: should insert default plans when no plans exist
  - name: plan_slug_unique
    id: BIL-007
    severity: error
    level: error
    description: 套餐 slug 全局唯一
    enforcement: DB unique index on slug
    test: should return credit usage records
  - name: billing_cycle_enum
    id: BIL-008
    severity: error
    level: error
    description: 计费周期限定 monthly/yearly
    enforcement: billingCycle 字段限制
    test: should refund credits successfully
state_machines:
  - name: subscription_lifecycle
    entity: Subscription
    description: 订阅生命周期状态机
    states:
      - active
      - cancelled
      - expired
      - trialing
    transitions:
      - from: trialing
        to: active
        trigger: trial 结束或用户选择付费
      - from: trialing
        to: cancelled
        trigger: trial 期间取消
      - from: active
        to: cancelled
        trigger: 用户取消
      - from: active
        to: expired
        trigger: 周期结束且不续费
      - from: cancelled
        to: expired
        trigger: 周期结束
    initial: active
seed_data:
  - entity: SubscriptionPlan
    records:
      - slug: free
        name: 免费版
        credits: 100
        priceMonthly: '0'
        maxProjects: 5
        maxStorageBytes: 104857600
        maxConcurrentTasks: 1
        sortOrder: 0
      - slug: starter
        name: 入门版
        credits: 500
        priceMonthly: '29'
        maxProjects: 20
        maxStorageBytes: 536870912
        maxConcurrentTasks: 3
        sortOrder: 1
      - slug: pro
        name: 专业版
        credits: 2000
        priceMonthly: '99'
        maxProjects: 100
        maxStorageBytes: 2147483648
        maxConcurrentTasks: 10
        sortOrder: 2
      - slug: enterprise
        name: 企业版
        credits: 10000
        priceMonthly: '299'
        maxProjects: -1
        maxStorageBytes: 10737418240
        maxConcurrentTasks: 50
        sortOrder: 3
