domain: auth
version: '1.0'
last_updated: '2025-04-06'
entities:
  - name: User
    table: users
    description: 平台用户
    fields:
      - name: id
        type: uuid
        pk: true
        default: gen_random_uuid()
      - name: email
        type: varchar(255)
        notNull: true
        unique: true
      - name: passwordHash
        type: text
        notNull: true
      - name: name
        type: varchar(100)
        notNull: true
      - name: avatar
        type: text
        nullable: true
      - name: role
        type: varchar(20)
        notNull: true
        default: user
      - name: credits
        type: integer
        notNull: true
        default: 100
      - name: isActive
        type: boolean
        notNull: true
        default: true
      - name: isEmailVerified
        type: boolean
        notNull: true
        default: false
      - name: lastLoginAt
        type: timestamp
        nullable: true
      - name: failedLoginAttempts
        type: integer
        notNull: true
        default: 0
      - name: lockedUntil
        type: timestamp
        nullable: true
      - name: createdAt
        type: timestamp
        notNull: true
        default: now()
      - name: updatedAt
        type: timestamp
        notNull: true
        default: now()
    indexes:
      - name: users_email_idx
        fields:
          - email
    timestamps: true
  - name: Session
    table: sessions
    description: 用户登录会话
    fields:
      - name: id
        type: uuid
        pk: true
        default: gen_random_uuid()
      - name: userId
        type: uuid
        notNull: true
        fk:
          table: users
          field: id
          onDelete: cascade
      - name: refreshToken
        type: text
        notNull: true
        unique: true
      - name: deviceInfo
        type: text
        nullable: true
      - name: ipAddress
        type: varchar(45)
        nullable: true
      - name: expiresAt
        type: timestamp
        notNull: true
      - name: isRevoked
        type: boolean
        notNull: true
        default: false
      - name: createdAt
        type: timestamp
        notNull: true
        default: now()
    indexes:
      - name: sessions_user_id_idx
        fields:
          - userId
      - name: sessions_refresh_token_idx
        fields:
          - refreshToken
    timestamps: false
  - name: OAuthAccount
    table: oauth_accounts
    description: 第三方 OAuth 账号绑定
    fields:
      - name: id
        type: uuid
        pk: true
        default: gen_random_uuid()
      - name: userId
        type: uuid
        notNull: true
        fk:
          table: users
          field: id
          onDelete: cascade
      - name: provider
        type: varchar(50)
        notNull: true
      - name: providerAccountId
        type: varchar(255)
        notNull: true
      - name: providerData
        type: text
        nullable: true
      - name: createdAt
        type: timestamp
        notNull: true
        default: now()
    indexes:
      - name: oauth_accounts_user_id_idx
        fields:
          - userId
      - name: oauth_accounts_provider_idx
        unique: true
        fields:
          - provider
          - providerAccountId
    timestamps: false
  - name: LoginLog
    table: login_logs
    description: 登录日志
    fields:
      - name: id
        type: uuid
        pk: true
        default: gen_random_uuid()
      - name: userId
        type: uuid
        nullable: true
        fk:
          table: users
          field: id
          onDelete: set null
      - name: email
        type: varchar(255)
        notNull: true
      - name: action
        type: varchar(50)
        notNull: true
      - name: ipAddress
        type: varchar(45)
        nullable: true
      - name: deviceInfo
        type: text
        nullable: true
      - name: success
        type: boolean
        notNull: true
      - name: failReason
        type: text
        nullable: true
      - name: createdAt
        type: timestamp
        notNull: true
        default: now()
    indexes:
      - name: login_logs_user_id_idx
        fields:
          - userId
      - name: login_logs_created_at_idx
        fields:
          - createdAt
    timestamps: false
operations:
  - name: register
    method: POST
    path: /auth/register
    description: 用户注册
    auth: none
    pre:
      - 邮箱未注册
      - 密码符合强度要求（≥8位，含字母和数字）
    effect:
      - 创建 User 记录
      - 创建登录日志
    errors:
      - status: 409
        condition: 邮箱已注册
        message: 邮箱已被注册
      - status: 400
        condition: 密码强度不足
        message: 密码至少 8 位，包含字母和数字
    test: true
  - name: login
    method: POST
    path: /auth/login
    description: 用户登录
    auth: none
    pre:
      - 用户存在且活跃
      - 密码正确
      - 账号未被锁定
    effect:
      - 创建 Session 记录
      - 更新 lastLoginAt
      - 重置 failedLoginAttempts
      - 设置 HttpOnly Cookie（accessToken + refreshToken）
    errors:
      - status: 401
        condition: 邮箱或密码错误
        message: 邮箱或密码错误
      - status: 423
        condition: 账号被锁定
        message: 账号已被锁定，请稍后再试
    test: true
  - name: refresh
    method: POST
    path: /auth/refresh
    description: 刷新访问令牌
    auth: none
    pre:
      - refreshToken 有效且未过期
      - Session 未被撤销
    effect:
      - 生成新 accessToken
      - 更新 Cookie
    errors:
      - status: 401
        condition: refreshToken 无效或过期
        message: Invalid refresh token
    test: true
  - name: logout
    method: POST
    path: /auth/logout
    description: 用户登出
    auth: jwt
    pre:
      - 用户已登录
    effect:
      - 撤销 Session
      - 清除 Cookie
    test: true
  - name: getProfile
    method: GET
    path: /auth/me
    description: 获取当前用户信息
    auth: jwt
    pre:
      - 用户已登录
    post:
      - 返回用户信息（不含 passwordHash）
    test: true
  - name: updateProfile
    method: PATCH
    path: /auth/me
    description: 更新用户信息
    auth: jwt
    pre:
      - 用户已登录
    effect:
      - 更新 User 记录
    test: true
  - name: changePassword
    method: POST
    path: /auth/change-password
    description: 修改密码
    auth: jwt
    pre:
      - 用户已登录
      - 旧密码正确
      - 新密码符合强度要求
    effect:
      - 更新 passwordHash
    errors:
      - status: 400
        condition: 新密码强度不足
        message: 密码至少 8 位，包含字母和数字
      - status: 401
        condition: 旧密码错误
        message: 当前密码错误
    test: true
  - name: getUser
    method: GET
    path: /users/:id
    auth: jwt
    description: 获取用户基本信息
    pre:
      - 用户存在
      - 有权限查看
    post:
      - 返回用户信息（不含密码）
    errors:
      - status: 404
        condition: 用户不存在
        message: 用户不存在
      - status: 403
        condition: 无权限
        message: 无权查看该用户信息
  - name: forgotPassword
    method: POST
    path: /auth/forgot-password
    description: 忘记密码（生成重置令牌）
    auth: none
    pre:
      - 邮箱已注册（不泄露用户是否存在）
    effect:
      - 生成 resetToken（JWT，15分钟过期）
      - 未配置邮件服务时直接返回 resetToken（开发/测试模式）
      - 配置邮件服务后通过邮件发送重置链接（生产模式）
    post:
      - 始终返回 success=true（防止用户枚举）
    test: true
  - name: resetPassword
    method: POST
    path: /auth/reset-password
    description: 重置密码
    auth: none
    pre:
      - resetToken 有效且未过期
      - 新密码符合强度要求
    effect:
      - 更新 passwordHash
      - 撤销该用户所有活跃 Session
      - resetToken 一次性使用（重置后失效）
    errors:
      - status: 400
        condition: 新密码强度不足
        message: 密码至少 8 位，包含字母和数字
      - status: 401
        condition: resetToken 无效或过期
        message: 重置链接已失效，请重新申请
    test: true
  - name: oauthRedirect
    method: GET
    path: /auth/oauth/:provider
    description: 重定向到 OAuth 提供商授权页面
    auth: none
    pre:
      - provider 为 'google' 或 'github'
      - 对应的 client_id 已配置
    effect:
      - 重定向到 provider 的 OAuth 授权页面
      - state 参数防止 CSRF
    errors:
      - status: 400
        condition: 不支持的 provider
        message: 不支持的 OAuth 提供商
  - name: oauthCallback
    method: GET
    path: /auth/oauth/:provider/callback
    description: OAuth 回调，交换授权码并登录
    auth: none
    pre:
      - code 参数有效
      - state 参数匹配
    effect:
      - 用 code 换取 access_token
      - 获取用户信息（email/name/avatar）
      - 若 oauth_account 已存在 -> 获取关联用户
      - 若 email 已注册 -> 关联 oauth_account
      - 若新用户 -> 创建用户 + oauth_account（随机密码）
      - 生成 JWT + 创建 Session
      - 重定向前端回调页面（含 accessToken/refreshToken）
    errors:
      - status: 400
        condition: 授权码无效或已使用
        message: OAuth 授权码无效
      - status: 500
        condition: 提供商 API 调用失败
        message: OAuth 服务暂时不可用
    test: true
rules:
  - name: email_unique
    id: AUTH-001
    severity: error
    level: error
    description: 邮箱全局唯一
    enforcement: DB unique index on email
    test: 应该拒绝重复邮箱注册
  - name: password_policy
    id: AUTH-002
    severity: error
    level: error
    description: 密码至少 8 位，包含字母和数字
    enforcement: 注册/改密码时校验
    test: "密码至少8位"
  - name: login_lockout
    id: AUTH-003
    severity: error
    level: error
    description: 连续 5 次登录失败锁定账号 15 分钟
    enforcement: failedLoginAttempts >= 5 → lockedUntil = now + 15min
    test: "登出后会话被标记为已撤销"
  - name: session_expiry
    id: AUTH-004
    severity: error
    level: error
    description: accessToken 15 分钟，refreshToken 7 天过期
    enforcement: JWT 签名时设置 exp
    test: 应该拒绝过期令牌
  - name: session_revocation
    id: AUTH-005
    severity: error
    level: error
    description: 登出后 Session 标记为已撤销，refreshToken 不可再用
    enforcement: 刷新时检查 isRevoked
    test: "刷新令牌时撤销旧会话（单会话模式）"
  - name: refresh_token_unique
    id: AUTH-006
    severity: error
    level: error
    description: refreshToken 全局唯一
    enforcement: DB unique index on refresh_token
    test: "刷新令牌具有唯一约束"
  - name: admin_role_required
    id: AUTH-007
    severity: error
    level: error
    description: 管理员接口需要 role=admin
    enforcement: AdminGuard 检查 role
    test: "管理员角色可以访问管理接口"
  - name: user_self_only
    id: AUTH-008
    severity: error
    level: error
    description: 用户只能修改自己的信息
    enforcement: getProfile/updateProfile 从 JWT 取 userId
    test: "用户只能修改自己的信息"
  - name: one_session_per_login
    id: AUTH-009
    severity: error
    level: error
    description: 每次登录创建一个新会话，不强制踢出旧会话
    enforcement: 登录时创建新 Session
    test: "刷新令牌时撤销旧会话（单会话模式）"
  - name: inactive_user_blocked
    id: AUTH-010
    severity: error
    level: error
    description: isActive=false 的用户不可登录
    enforcement: 登录前检查 isActive
    test: "非活跃用户无法登录"
  - name: reset_token_expiry
    id: AUTH-011
    severity: error
    level: error
    description: 密码重置令牌 15 分钟过期
    enforcement: JWT 签名时设置 15min exp
    test: "无效令牌应抛出异常"
  - name: reset_token_invalidates_sessions
    id: AUTH-012
    severity: error
    level: error
    description: 密码重置后撤销该用户所有活跃 Session
    enforcement: resetPassword 中 UPDATE sessions SET isRevoked=true
    test: "重置密码后撤销所有会话"
  - name: forgot_password_no_enumeration
    id: AUTH-013
    severity: error
    level: error
    description: 忘记密码接口不泄露用户是否存在
    enforcement: 无论邮箱是否注册都返回 success=true
    test: "未注册邮箱也返回成功"
state_machines:
  - name: account_lockout
    entity: User
    description: 账号锁定状态机
    states:
      - active
      - locked
    transitions:
      - from: active
        to: locked
        trigger: failedLoginAttempts >= 5
      - from: locked
        to: active
        trigger: 锁定时间超过 15 分钟或手动解锁
    initial: active
