# ============================================================
# VibeAI — 画廊域规格 (Gallery Domain)
# ============================================================
domain: gallery
version: "1.0"
last_updated: "2025-04-06"

# ============================================================
# 实体定义
# ============================================================
entities:
  - name: GalleryWork
    table: gallery_works
    description: "画廊作品"
    fields:
      - name: id
        type: uuid
        pk: true
        default: gen_random_uuid()
      - name: userId
        type: uuid
        notNull: true
        fk: { table: "users", field: "id", onDelete: "cascade" }
      - name: title
        type: varchar(255)
        notNull: true
        default: ""
      - name: imageUrl
        type: text
        nullable: true
      - name: videoUrl
        type: text
        nullable: true
      - name: type
        type: varchar(20)
        notNull: true
        default: image
      - name: prompt
        type: text
        nullable: true
      - name: modelSlug
        type: varchar(100)
        nullable: true
      - name: capabilitySlug
        type: varchar(100)
        nullable: true
      - name: thumbnailUrl
        type: text
        nullable: true
      - name: likes
        type: integer
        notNull: true
        default: 0
      - name: views
        type: integer
        notNull: true
        default: 0
      - name: isPublished
        type: boolean
        notNull: true
        default: false
      - name: createdAt
        type: timestamp
        notNull: true
        default: now()
      - name: updatedAt
        type: timestamp
        notNull: true
        default: now()
    indexes:
      - name: gallery_works_user_id_idx
        fields: [userId]
      - name: gallery_works_type_idx
        fields: [type]
      - name: gallery_works_is_published_idx
        fields: [isPublished]
      - name: gallery_works_created_at_idx
        fields: [createdAt]
      - name: gallery_works_likes_idx
        fields: [likes]
    timestamps: true

  - name: GalleryLike
    table: gallery_likes
    description: "作品点赞"
    fields:
      - name: id
        type: uuid
        pk: true
        default: gen_random_uuid()
      - name: workId
        type: uuid
        notNull: true
        fk: { table: "gallery_works", field: "id", onDelete: "cascade" }
      - name: userId
        type: uuid
        notNull: true
        fk: { table: "users", field: "id", onDelete: "cascade" }
      - name: createdAt
        type: timestamp
        notNull: true
        default: now()
    indexes:
      - name: gallery_likes_work_id_idx
        fields: [workId]
      - name: gallery_likes_user_id_idx
        fields: [userId]
      - name: gallery_likes_work_user_unique_idx
        unique: true
        fields: [workId, userId]
    timestamps: false

# ============================================================
# 操作定义
# ============================================================
operations:
  - name: listWorks
    method: GET
    path: /gallery/works
    description: "获取作品列表（公开）"
    auth: none
    post:
      - "返回公开作品列表（分页，支持按标签/类型筛选）"
    test: true

  - name: getWork
    method: GET
    path: /gallery/works/:id
    description: "获取作品详情"
    auth: none
    pre:
      - "作品存在且已发布"
    errors:
      - status: 404
        condition: "作品不存在或未发布"
        message: "作品不存在"
    test: true

  - name: publishWork
    method: POST
    path: /gallery/works
    description: "发布作品到画廊"
    auth: jwt
    pre:
      - "用户已登录"
    effect:
      - "创建 GalleryWork 记录"
    test: true

  - name: likeWork
    method: POST
    path: /gallery/works/:id/like
    description: "点赞/取消点赞作品"
    auth: jwt
    pre:
      - "用户已登录"
      - "作品存在且已发布"
    effect:
      - "若已点赞则删除 GalleryLike"
      - "若未点赞则创建 GalleryLike"
      - "更新 GalleryWork.likes 计数"
    test: true

  - name: getLikeStatus
    method: GET
    path: /gallery/works/:id/like
    description: "查看当前用户是否已点赞"
    auth: jwt
    pre:
      - "用户已登录"
    test: true

  - name: deleteWork
    method: DELETE
    path: /gallery/works/:id
    description: "删除作品"
    auth: jwt
    pre:
      - "用户已登录"
      - "作品存在且属于当前用户"
    effect:
      - "删除 GalleryWork 及关联的点赞"
    errors:
      - status: 404
        condition: "作品不存在"
        message: "作品不存在"
    test: true

  - name: listMyWorks
    method: GET
    path: /gallery/my-works
    description: "获取当前用户的作品列表"
    auth: jwt
    pre:
      - "用户已登录"
    test: true

# ============================================================
# 业务规则
# ============================================================
rules:
  - name: work_owner_only
    id: GAL-001
    severity: error
    level: error
    description: "只有作品所有者可删除作品"
    enforcement: "删除时检查 userId = jwt.userId"
    test: "用户应能成功发布作品"

  - name: one_like_per_user
    id: GAL-002
    severity: error
    level: error
    description: "每个用户对同一作品只能点赞一次"
    enforcement: "unique index on (workId, userId)"
    test: "用户可以对作品点赞"

  - name: like_self_deny
    id: GAL-003
    severity: error
    level: error
    description: "用户不能给自己的作品点赞"
    enforcement: "点赞前检查 userId != work.userId"
    test: "已经点赞的作品应返回 true"

  - name: published_only_visible
    id: GAL-004
    severity: error
    level: error
    description: "未发布作品不在公开列表中显示"
    enforcement: "listWorks 只返回 isPublished=true"
    test: "公开画廊只显示已发布作品"

  - name: like_count_sync
    id: GAL-005
    severity: error
    level: error
    description: "GalleryWork.likes 必须与 GalleryLike 记录数一致"
    enforcement: "点赞/取消点赞时同步更新 likes 计数"
    test: "已登录用户可以查看自己的作品"