# ============================================================
# VibeAI — 任务引擎域规格 (Task Engine Domain)
# ============================================================
domain: engine
version: "1.0"
last_updated: "2025-04-06"

# ============================================================
# 实体定义
# ============================================================
entities:
  - name: Project
    table: projects
    description: "用户创作项目"
    fields:
      - name: id
        type: uuid
        pk: true
        default: gen_random_uuid()
      - name: userId
        type: uuid
        notNull: true
        fk: { table: "users", field: "id", onDelete: "cascade" }
      - name: name
        type: varchar(255)
        notNull: true
      - name: description
        type: text
        nullable: true
      - name: type
        type: varchar(50)
        notNull: true
        enum: ["video", "image", "audio", "mixed"]
      - name: coverImage
        type: text
        nullable: true
      - name: tags
        type: "text[]"
        nullable: true
        default: "[]"
      - name: meta
        type: jsonb
        nullable: true
      - name: isArchived
        type: boolean
        notNull: true
        default: false
      - name: createdAt
        type: timestamp
        notNull: true
        default: now()
      - name: updatedAt
        type: timestamp
        notNull: true
        default: now()
    indexes:
      - fields: ["userId"]
        name: projects_user_id_idx
      - fields: ["type"]
        name: projects_type_idx
      - fields: ["createdAt"]
        name: projects_created_at_idx
    relations:
      - type: hasMany
        target: Task
        via: projectId

  - name: Task
    table: tasks
    description: "AI 生成任务"
    fields:
      - name: id
        type: uuid
        pk: true
        default: gen_random_uuid()
      - name: projectId
        type: uuid
        notNull: true
        fk: { table: "projects", field: "id", onDelete: "cascade" }
      - name: userId
        type: uuid
        notNull: true
        fk: { table: "users", field: "id", onDelete: "cascade" }
      - name: type
        type: varchar(50)
        notNull: true
        enum: ["text_to_image", "image_to_video", "text_to_video", "image_generation", "image_editing", "video_editing"]
      - name: status
        type: varchar(20)
        notNull: true
        default: pending
        enum: ["pending", "queued", "running", "completed", "failed", "cancelled", "refunding", "refunded"]
      - name: progress
        type: integer
        notNull: true
        default: 0
        range: [0, 100]
      - name: inputParams
        type: jsonb
        notNull: true
      - name: resultUrls
        type: "text[]"
        nullable: true
      - name: modelUsed
        type: varchar(100)
        nullable: true
      - name: creditsCost
        type: integer
        notNull: true
        default: 0
      - name: errorMessage
        type: text
        nullable: true
      - name: maxRetries
        type: integer
        notNull: true
        default: 3
      - name: retryCount
        type: integer
        notNull: true
        default: 0
      - name: startedAt
        type: timestamp
        nullable: true
      - name: completedAt
        type: timestamp
        nullable: true
      - name: createdAt
        type: timestamp
        notNull: true
        default: now()
      - name: updatedAt
        type: timestamp
        notNull: true
        default: now()
    indexes:
      - fields: ["projectId"]
        name: tasks_project_id_idx
      - fields: ["userId"]
        name: tasks_user_id_idx
      - fields: ["status"]
        name: tasks_status_idx
      - fields: ["createdAt"]
        name: tasks_created_at_idx
    relations:
      - type: hasMany
        target: ExecutionState
        via: taskId

  - name: ExecutionState
    table: execution_states
    description: "任务执行状态日志（时序记录）"
    fields:
      - name: id
        type: uuid
        pk: true
        default: gen_random_uuid()
      - name: taskId
        type: uuid
        notNull: true
        fk: { table: "tasks", field: "id", onDelete: "cascade" }
      - name: step
        type: varchar(100)
        notNull: true
      - name: status
        type: varchar(20)
        notNull: true
        enum: ["pending", "running", "completed", "failed"]
      - name: progress
        type: integer
        default: 0
        range: [0, 100]
      - name: message
        type: text
        nullable: true
      - name: output
        type: jsonb
        nullable: true
      - name: startedAt
        type: timestamp
        notNull: true
        default: now()
      - name: completedAt
        type: timestamp
        nullable: true
      - name: createdAt
        type: timestamp
        notNull: true
        default: now()
      - name: updatedAt
        type: timestamp
        notNull: true
        default: now()
    indexes:
      - fields: ["taskId"]
        name: execution_states_task_id_idx

# ============================================================
# 状态机定义
# ============================================================
state_machines:
  - entity: Task.status
    description: "AI 生成任务生命周期"
    states:
      pending: { label: "待处理", allowed: ["queued", "cancelled"] }
      queued: { label: "排队中", allowed: ["running", "cancelled"] }
      running: { label: "执行中", allowed: ["completed", "failed", "refunding"] }
      completed: { label: "已完成", allowed: [] }
      failed: { label: "失败", allowed: ["queued"] }
      cancelled: { label: "已取消", allowed: ["refunding"] }
      refunding: { label: "退款中", allowed: ["refunded"] }
      refunded: { label: "已退款", allowed: [] }
    transitions:
      - from: pending
        to: queued
        trigger: "队列调度"
        condition: "信用额度足够"
      - from: pending
        to: cancelled
        trigger: "用户取消"
      - from: queued
        to: running
        trigger: "AI 模型开始执行"
      - from: queued
        to: cancelled
        trigger: "用户取消"
      - from: running
        to: completed
        trigger: "AI 生成完成"
      - from: running
        to: failed
        trigger: "AI 生成失败"
        condition: "重试次数不足"
      - from: running
        to: refunding
        trigger: "系统异常需退款"
      - from: failed
        to: queued
        trigger: "重新入队"
        condition: "retryCount < maxRetries"
      - from: cancelled
        to: refunding
        trigger: "已扣费取消需退款"
      - from: refunding
        to: refunded
        trigger: "退款成功"

# ============================================================
# 操作定义
# ============================================================
operations:
  - name: createProject
    summary: "创建项目"
    method: POST
    path: /api/projects
    auth: jwt
    input:
      name: { type: "string", minLength: 1, maxLength: 255, desc: "项目名称" }
      type: { type: "string", enum: ["video", "image", "audio", "mixed"], desc: "项目类型" }
      description: { type: "string", optional: true, desc: "项目描述" }
      tags: { type: "string[]", optional: true, desc: "标签列表" }
    output:
      data:
        id: uuid
        name: string
        type: string
        createdAt: string
    pre:
      - "用户已认证"
    post:
      - "创建项目记录，userId 关联到当前用户"
    effect:
      - "INSERT INTO projects"
    errors:
      - status: 400
        condition: "参数校验失败"
        message: "请求参数不合法"

  - name: listProjects
    summary: "获取项目列表"
    method: GET
    path: /api/projects
    auth: jwt
    input:
      page: { type: "number", optional: true, default: 1, desc: "页码" }
      limit: { type: "number", optional: true, default: 20, desc: "每页数量" }
      type: { type: "string", optional: true, desc: "按类型筛选" }
    output:
      data: { items: "array", total: "number", page: "number", limit: "number" }
    pre:
      - "用户已认证"
    post:
      - "仅返回当前用户的项目"
      - "按 createdAt 倒序排列"

  - name: getProject
    summary: "获取项目详情"
    method: GET
    path: /api/projects/:id
    auth: jwt
    output:
      data: { id: uuid, name: string, type: string, description: { type: "string", nullable: true }, tasks: "array", createdAt: string }
    pre:
      - "项目存在"
      - "当前用户是项目所有者"
    post:
      - "返回项目完整信息及关联任务列表"
    errors:
      - status: 404
        condition: "项目不存在"
        message: "项目不存在"
      - status: 403
        condition: "非项目所有者"
        message: "无权访问此项目"

  - name: deleteProject
    summary: "删除项目"
    method: DELETE
    path: /api/projects/:id
    auth: jwt
    pre:
      - "项目存在"
      - "当前用户是项目所有者"
    post:
      - "级联删除关联的所有任务和状态记录"
    effect:
      - "DELETE FROM projects WHERE id=:id AND userId=:userId"
    errors:
      - status: 404
        condition: "项目不存在"
        message: "项目不存在"
      - status: 403
        condition: "非项目所有者"
        message: "无权删除此项目"

  - name: submitTask
    summary: "提交 AI 生成任务"
    method: POST
    path: /api/tasks
    auth: jwt
    input:
      projectId: { type: "uuid", desc: "所属项目" }
      type: { type: "string", enum: ["text_to_image", "image_to_video", "text_to_video", "image_generation", "image_editing", "video_editing"], desc: "任务类型" }
      inputParams: { type: "object", desc: "输入参数（根据任务类型不同）" }
    output:
      data:
        id: uuid
        status: string
        creditsCost: number
    pre:
      - "用户信用额度 ≥ 任务所需信用"
      - "用户并发任务数 ≤ 套餐限制"
    post:
      - "创建任务记录，status=pending"
      - "预扣信用额度"
      - "通过 WebSocket 推送任务创建事件"
    effect:
      - "INSERT INTO tasks"
      - "UPDATE users SET credits = credits - cost"
    errors:
      - status: 402
        condition: "信用额度不足"
        message: "信用额度不足，需要 ${cost}，当前 ${available}"
        test: "submit_task_insufficient_credits"
      - status: 429
        condition: "并发任务超限"
        message: "超出并发任务限制"
        test: "submit_task_concurrency_limit"
      - status: 400
        condition: "参数校验失败"
        message: "请求参数不合法"

  - name: listTasks
    summary: "获取任务列表"
    method: GET
    path: /api/tasks
    auth: jwt
    input:
      projectId: { type: "uuid", optional: true, desc: "按项目筛选" }
      status: { type: "string", optional: true, desc: "按状态筛选" }
      page: { type: "number", optional: true, default: 1 }
      limit: { type: "number", optional: true, default: 20 }
    output:
      data: { items: "array", total: "number" }
    pre:
      - "JWT token 有效"
    post:
      - "仅返回当前用户的任务"
      - "按 createdAt 倒序排列"

  - name: getTask
    summary: "获取任务详情"
    method: GET
    path: /api/tasks/:id
    auth: jwt
    output:
      data:
        id: uuid
        type: string
        status: string
        progress: number
        inputParams: object
        resultUrls: { type: "string[]", nullable: true }
        creditsCost: number
        errorMessage: { type: "string", nullable: true }
        createdAt: string
    pre:
      - "任务存在"
      - "当前用户是任务所有者"
    post:
      - "返回任务完整信息"
    errors:
      - status: 404
        condition: "任务不存在"
        message: "任务不存在"

  - name: cancelTask
    summary: "取消任务"
    method: POST
    path: /api/tasks/:id/cancel
    auth: jwt
    pre:
      - "任务存在"
      - "当前用户是任务所有者"
      - "任务状态可以是 pending 或 queued"
    post:
      - "更新任务状态为 cancelled"
      - "如需退款则进入 refunding 状态"
    errors:
      - status: 400
        condition: "当前状态不可取消"
        message: "任务当前状态 ${status} 不可取消"
        test: "cancel_task_invalid_status"

  - name: retryTask
    summary: "重试失败任务"
    method: POST
    path: /api/tasks/:id/retry
    auth: jwt
    pre:
      - "任务存在"
      - "任务状态为 failed"
      - "retryCount < maxRetries"
    post:
      - "更新任务状态为 queued"
      - "递增 retryCount"
    errors:
      - status: 400
        condition: "超出重试次数"
        message: "已达到最大重试次数 ${maxRetries}"
        test: "retry_task_exceeded_max"

  - name: completeTaskWithCredits
    summary: "完成任务并结算信用（内部）"
    method: N/A
    path: N/A
    auth: internal
    pre:
      - "任务存在且状态为 running"
    post:
      - "更新任务状态为 completed"
      - "设置 resultUrls 和 completedAt"
      - "通过 WebSocket 推送完成事件"
    effect:
      - "UPDATE tasks SET status=completed, resultUrls=urls, completedAt=now()"
      - "通过 WebSocket 通知客户端"

  - name: failTaskWithRefund
    summary: "标记任务失败并退款（内部）"
    method: N/A
    path: N/A
    auth: internal
    pre:
      - "任务存在且状态为 running"
    post:
      - "更新任务状态为 failed"
      - "设置 errorMessage"
      - "信用额度退回"
    effect:
      - "UPDATE tasks SET status=failed, errorMessage=msg"
      - "UPDATE users SET credits = credits + cost"

  - name: getTaskStateHistory
    summary: "获取任务执行状态历史"
    method: GET
    path: /api/tasks/:id/states
    auth: jwt
    output:
      data: { items: "array" }
    pre:
      - "任务存在"
      - "当前用户是任务所有者"
    post:
      - "按 startedAt 顺序返回执行状态记录"

# ============================================================
# 业务规则
# ============================================================
rules:
  - id: ENGINE-001
    description: "任务状态转换必须严格遵循状态机定义"
    severity: error
    enforcement: service_logic
    test: "task_state_transition_valid"

  - id: ENGINE-002
    description: "只有项目所有者可以删除项目"
    severity: error
    enforcement: service_logic
    test: "delete_project_unauthorized"

  - id: ENGINE-003
    description: "任务进度 0-100 闭区间"
    severity: error
    enforcement: zod_schema

  - id: ENGINE-004
    description: "取消任务仅允许 pending 或 queued 状态"
    severity: error
    enforcement: service_logic
    test: "cancel_task_invalid_status"

  - id: ENGINE-005
    description: "重试次数不超过 maxRetries"
    severity: error
    enforcement: service_logic
    test: "retry_task_exceeded_max"

  - id: ENGINE-006
    description: "提交任务时预扣信用额度"
    severity: error
    enforcement: service_logic
    test: "submit_task_credits_deducted"

  - id: ENGINE-007
    description: "失败任务退回信用额度"
    severity: error
    enforcement: service_logic
    test: "fail_task_refund"

  - id: ENGINE-008
    description: "项目列表仅返回当前用户的项目"
    severity: error
    enforcement: service_logic
    test: "list_projects_scoped_to_user"

# ============================================================
# 错误码汇总
# ============================================================
errors:
  - code: ENGINE_PROJECT_NOT_FOUND
    status: 404
    message: "项目不存在"
  - code: ENGINE_PROJECT_ACCESS_DENIED
    status: 403
    message: "无权访问此项目"
  - code: ENGINE_TASK_NOT_FOUND
    status: 404
    message: "任务不存在"
  - code: ENGINE_INSUFFICIENT_CREDITS
    status: 402
    message: "信用额度不足，需要 ${cost}，当前 ${available}"
  - code: ENGINE_CONCURRENCY_LIMIT
    status: 429
    message: "超出并发任务限制"
  - code: ENGINE_CANCEL_INVALID_STATUS
    status: 400
    message: "任务当前状态 ${status} 不可取消"
  - code: ENGINE_RETRY_EXCEEDED
    status: 400
    message: "已达到最大重试次数 ${maxRetries}"