domain: engine
version: '2.0'
last_updated: '2025-01-15'
entities:
  - name: Project
    table: projects
    description: 创作项目
    fields:
      - name: id
        type: uuid
        pk: true
        default: gen_random_uuid()
      - name: userId
        type: uuid
        notNull: true
        fk:
          table: users
          field: id
          onDelete: cascade
      - name: name
        type: varchar(200)
        notNull: true
      - name: description
        type: text
        nullable: true
      - name: coverImage
        type: text
        nullable: true
      - name: status
        type: varchar(20)
        notNull: true
        default: draft
      - name: template
        type: varchar(50)
        nullable: true
      - name: tags
        type: text[]
        default: '[]'
      - name: metadata
        type: jsonb
        default: '{}'
      - name: totalTasks
        type: integer
        notNull: true
        default: 0
      - name: completedTasks
        type: integer
        notNull: true
        default: 0
      - name: createdAt
        type: timestamp
        notNull: true
        default: now()
      - name: updatedAt
        type: timestamp
        notNull: true
        default: now()
    indexes:
      - name: projects_user_id_idx
        fields:
          - userId
      - name: projects_status_idx
        fields:
          - status
      - name: projects_created_at_idx
        fields:
          - createdAt
    timestamps: true
  - name: Task
    table: tasks
    description: AI 生成任务
    fields:
      - name: id
        type: uuid
        pk: true
        default: gen_random_uuid()
      - name: projectId
        type: uuid
        nullable: true
        fk:
          table: projects
          field: id
          onDelete: set null
      - name: userId
        type: uuid
        notNull: true
        fk:
          table: users
          field: id
          onDelete: cascade
      - name: type
        type: varchar(50)
        notNull: true
        desc: 能力标识，等同 capabilitySlug
      - name: status
        type: varchar(20)
        notNull: true
        default: queued
        desc: queued | submitting | completing | completed | failed | cancelled
      - name: priority
        type: integer
        notNull: true
        default: 0
      - name: progress
        type: integer
        notNull: true
        default: 0
      - name: input
        type: jsonb
        notNull: true
      - name: output
        type: jsonb
        nullable: true
      - name: result
        type: jsonb
        nullable: true
      - name: modelSlug
        type: varchar(100)
        nullable: true
      - name: capabilitySlug
        type: varchar(100)
        nullable: true
        desc: AI 能力标识，与 type 冗余但语义更清晰
      - name: creditsCost
        type: integer
        notNull: true
        default: 0
        desc: 本次任务消耗的信用额度
      - name: providerTaskId
        type: varchar(255)
        nullable: true
        desc: SDK 返回的外部任务 ID
      - name: sourceTaskId
        type: uuid
        nullable: true
        desc: 溯源任务 ID，用于一键同款
      - name: expiresAt
        type: timestamp
        nullable: true
        desc: 任务超时时间
      - name: errorMessage
        type: text
        nullable: true
      - name: startedAt
        type: timestamp
        nullable: true
      - name: completedAt
        type: timestamp
        nullable: true
      - name: estimatedCompletionAt
        type: timestamp
        nullable: true
      - name: createdAt
        type: timestamp
        notNull: true
        default: now()
      - name: updatedAt
        type: timestamp
        notNull: true
        default: now()
    indexes:
      - name: tasks_project_id_idx
        fields:
          - projectId
      - name: tasks_user_id_idx
        fields:
          - userId
      - name: tasks_status_idx
        fields:
          - status
      - name: tasks_type_idx
        fields:
          - type
      - name: tasks_created_at_idx
        fields:
          - createdAt
      - name: tasks_source_task_id_idx
        fields:
          - sourceTaskId
    timestamps: true
  - name: ExecutionState
    table: execution_states
    description: 任务执行步骤状态
    fields:
      - name: id
        type: uuid
        pk: true
        default: gen_random_uuid()
      - name: taskId
        type: uuid
        notNull: true
        fk:
          table: tasks
          field: id
          onDelete: cascade
      - name: step
        type: varchar(100)
        notNull: true
      - name: status
        type: varchar(20)
        notNull: true
        default: pending
      - name: progress
        type: integer
        notNull: true
        default: 0
      - name: message
        type: text
        nullable: true
      - name: metadata
        type: jsonb
        default: '{}'
      - name: startedAt
        type: timestamp
        nullable: true
      - name: completedAt
        type: timestamp
        nullable: true
      - name: createdAt
        type: timestamp
        notNull: true
        default: now()
    indexes:
      - name: execution_states_task_id_idx
        fields:
          - taskId
      - name: execution_states_step_idx
        fields:
          - step
    timestamps: false
operations:
  - name: createProject
    method: POST
    path: /projects
    description: 创建项目
    auth: jwt
    pre:
      - 用户已登录
      - 用户项目数未达套餐上限
    effect:
      - 创建 Project 记录
    errors:
      - status: 409
        condition: 项目数达到上限
        message: 项目数已达套餐上限
    test: true
  - name: listProjects
    method: GET
    path: /projects
    description: 获取项目列表
    auth: jwt
    pre:
      - 用户已登录
    post:
      - 返回用户的项目列表
    test: true
  - name: getProject
    method: GET
    path: /projects/:id
    description: 获取项目详情
    auth: jwt
    pre:
      - 用户已登录
      - 项目存在且属于当前用户
    errors:
      - status: 404
        condition: 项目不存在
        message: 项目不存在
    test: true
  - name: updateProject
    method: PATCH
    path: /projects/:id
    description: 更新项目信息
    auth: jwt
    pre:
      - 用户已登录
      - 项目存在且属于当前用户
    effect:
      - 更新 Project 记录
    errors:
      - status: 404
        condition: 项目不存在
        message: 项目不存在
    test: true
  - name: deleteProject
    method: DELETE
    path: /projects/:id
    description: 删除项目
    auth: jwt
    pre:
      - 用户已登录
      - 项目存在且属于当前用户
    effect:
      - 删除 Project 及其下的 Tasks
    errors:
      - status: 404
        condition: 项目不存在
        message: 项目不存在
    test: true
  - name: createTask
    method: N/A
    auth: internal
    path: /tasks
    description: 创建任务（通过 POST /gateway/generate 间接创建，非直接 HTTP 路由）
    test: true
  - name: listTasks
    method: GET
    path: /tasks
    description: 获取任务列表
    auth: jwt
    pre:
      - 用户已登录
    post:
      - 返回用户的任务列表
    test: true
  - name: getTask
    method: GET
    path: /tasks/:id
    description: 获取任务详情
    auth: jwt
    pre:
      - 用户已登录
      - 任务存在且属于当前用户
    errors:
      - status: 404
        condition: 任务不存在
        message: 任务不存在
    test: true
  - name: cancelTask
    method: POST
    path: /tasks/:id/cancel
    description: 取消任务
    auth: jwt
    pre:
      - 用户已登录
      - 任务存在且属于当前用户
      - 任务状态为 queued/submitting
    effect:
      - 更新任务状态为 cancelled
      - 退还预扣的信用额度
    errors:
      - status: 422
        condition: 任务状态不可取消
        message: 任务已完成或已取消，无法取消
    test: true
  - name: getTaskStates
    method: GET
    path: /tasks/:id/states
    description: 获取任务执行步骤状态
    auth: jwt
    pre:
      - 用户已登录
      - 任务存在且属于当前用户
    post:
      - 返回 ExecutionStates 列表
    test: true
  - name: retryTask
    method: POST
    path: /tasks/:id/retry
    description: 重试失败的任务
    auth: jwt
    pre:
      - 用户已登录
      - 任务存在且属于当前用户
      - 任务状态为 failed
    effect:
      - 重置任务状态为 queued
    test: true
  - name: getTaskWebSocket
    method: N/A
    path: /ws/tasks/:id
    description: WebSocket 实时推送任务状态（by ws://）
    auth: jwt
    test: true
rules:
  - name: project_owner_only
    id: ENG-001
    severity: error
    level: error
    description: 只有项目所有者可查看/修改/删除项目
    enforcement: 所有项目操作检查 userId = jwt.userId
    test: "只有项目所有者可以删除项目"
  - name: task_owner_only
    id: ENG-002
    severity: error
    level: error
    description: 只有任务所有者可查看/取消任务
    enforcement: 所有任务操作检查 userId = jwt.userId
    test: should cancel a queued task
  - name: task_status_guard
    id: ENG-003
    severity: error
    level: error
    description: 已完成/已取消的任务不可再取消
    enforcement: 取消前检查 status 是否在 queued/submitting 中
    test: should throw BadRequestException when task is completed (ENG-003)
  - name: progress_bounds
    id: ENG-004
    severity: error
    level: error
    description: progress 必须在 0-100 范围内
    enforcement: 更新时 clamp progress
    test: should clamp progress to 0 when negative (ENG-004)
  - name: concurrent_task_limit
    id: ENG-005
    severity: error
    level: error
    description: 用户并发任务数受套餐限制
    enforcement: 提交任务前检查 submitting 任务数 < maxConcurrentTasks
    test: should fail task and refund credits
  - name: project_max_projects
    id: ENG-006
    severity: error
    level: error
    description: 用户项目数受套餐限制
    enforcement: 创建项目前检查项目数 < maxProjects
    test: should create a project
  - name: cascade_delete
    id: ENG-007
    severity: error
    level: error
    description: 删除项目时级联删除其任务
    enforcement: DB onDelete cascade
    test: should delete a project
  - name: execution_state_logging
    id: ENG-008
    severity: error
    level: error
    description: 每个任务执行步骤必须记录 ExecutionState
    enforcement: 任务执行时写入 execution_states 表
    test: should create execution state
  - name: credit_reserve_on_submit
    id: ENG-009
    severity: error
    level: error
    description: 任务提交时必须预扣信用额度，失败或取消时退还
    enforcement: submitGeneration 调用 billingService.reserveCredits，失败时 refundCredits
    test: should check credits when creditCost is specified
  - name: task_timeout
    id: ENG-010
    severity: error
    level: error
    description: 任务超过 expiresAt 未完成时自动标记 failed 并退还信用
    enforcement: 定时扫描 expiresAt < now() 且 status 为 submitting 的任务
    test: should fail task and refund credits
state_machine:
  entity: Task
  field: status
  description: AI 生成任务执行状态机
  states:
    queued: 任务已创建，等待执行
    submitting: 正在调用 SDK 执行（含 SDK 内部轮询）
    completing: SDK 返回结果，正在转存到存储
    completed: 任务完成，终态
    failed: 任务失败，终态
    cancelled: 任务取消，终态
  transitions:
    - from: queued
      to:
        - submitting
        - cancelled
        - failed
      desc: 开始执行或用户取消或创建失败
    - from: submitting
      to:
        - completing
        - failed
        - cancelled
      desc: SDK 返回结果或调用失败或用户取消
    - from: completing
      to:
        - completed
        - failed
      desc: 转存完成或转存失败
    - from: failed
      to:
        - queued
      desc: 用户重试
  initial: queued
  terminal:
    - completed
    - failed
    - cancelled
